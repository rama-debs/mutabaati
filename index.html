<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2B33">
<title>متابعتي</title>
<!--
  ارفعي هذا الرقم عند كل تحديث تنشرينه — هذا وحده يكفي ليأخذ هاتفكِ
  النسخة الجديدة (يُستعمل في اسم كاش الـ service worker في sw.js).
-->
<script>const VERSION='1.2.0';</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="متابعتي">
<style>
  :root{
    --bg:#F1EFEA; --card:#FFFFFF; --ink:#2A2B33; --soft:#6E7080;
    --plum:#7A4A63; --moss:#4C6B52; --amber:#B8862F; --sky:#3A6B86; --line:#DCD8D0;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:"Tajawal","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:16px; line-height:1.6;
    padding-bottom:78px;
  }
  h1,h2,h3,h4{margin:0; font-weight:700;}
  button{font-family:inherit; cursor:pointer;}

  /* الرأس */
  header{
    padding:18px 16px 8px; position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg,var(--bg) 70%, rgba(241,239,234,0));
  }
  .app-title{font-size:22px; color:var(--plum); letter-spacing:.5px;}
  .app-date{color:var(--soft); font-size:14px; margin-top:2px;}

  #view{padding:6px 14px 20px; max-width:640px; margin:0 auto;}

  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px; margin-bottom:14px;
    box-shadow:0 1px 2px rgba(42,43,51,.04);
  }
  .card h3{font-size:17px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .section-title{color:var(--soft); font-size:13px; font-weight:700; margin:18px 4px 8px;}

  /* شريط التقدم */
  .bar{background:var(--line); border-radius:99px; height:10px; overflow:hidden; margin:6px 0;}
  .bar .fill{height:100%; border-radius:99px; background:var(--moss); transition:width .3s;}

  /* الأصعدة الأربعة */
  .sphere-card{padding:14px 16px;}
  .sphere-head{display:flex; align-items:center; gap:14px; cursor:pointer;}
  .sphere-ring-fill{transition:stroke-dashoffset .6s ease;}
  .sphere-name{font-size:16px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .sphere-check{font-size:15px;}
  .sphere-goals{margin-top:12px; padding-top:8px; border-top:1px solid var(--line);}
  .kin-card.due{border-color:#3A6B86;}
  .kin-item{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;}
  .kin-title{font-size:14px; color:var(--ink);}
  .kin-kids-item{flex-direction:column; align-items:stretch; gap:8px;}
  .kin-count{font-size:12px; color:var(--soft);}
  .kin-next{font-size:13px; color:var(--soft); margin-top:6px;}
  .today-summary{text-align:center; color:var(--soft); font-size:13px; margin:4px 0 14px;}
  .toggle-row{display:flex; gap:8px; justify-content:center; margin-bottom:14px;}

  /* شريط الأهداف الخاصة بيوم بعينه */
  .day-banner{
    background:rgba(184,134,47,.15); border:1px solid rgba(184,134,47,.35);
    color:var(--ink); border-radius:12px; padding:10px 14px; font-size:14px;
    text-align:center; margin-bottom:12px;
  }
  .weekly-banner{
    background:rgba(58,107,134,.15); border:1px solid rgba(58,107,134,.4);
    color:#3A6B86; font-weight:700; cursor:pointer;
  }
  /* شاشة أسبوعي */
  .weekly-time-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 2px; border-bottom:1px solid var(--line);}
  .weekly-time-row:last-child{border-bottom:0;}
  .weekly-time-name{font-size:14px; flex:1;}
  .weekly-summary{background:rgba(76,107,82,.1); border:1px solid rgba(76,107,82,.3); font-size:15px; line-height:1.9;}
  .weekly-summary-note{margin-top:8px; font-size:13px; color:var(--soft);}
  .weekly-export-btn{width:100%; margin:4px 0 20px; padding:15px; font-size:16px;}

  /* أهداف اليوم */
  .goal{padding:11px 4px; border-bottom:1px solid var(--line);}
  .goal:last-child{border-bottom:0;}
  .goal-row-click{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .goal .chk{
    width:26px; height:26px; border-radius:8px; border:2px solid var(--line);
    flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:16px; background:#fff; transition:.15s;
  }
  .goal.done .chk{background:var(--moss); border-color:var(--moss);}
  .goal.missed .chk{background:var(--plum); border-color:var(--plum);}
  .goal .name{flex:1; color:var(--soft);}
  .goal.done .name, .goal.missed .name{color:var(--ink); font-weight:700;}
  .goal .name.special{font-weight:700;}
  .goal .name .star{color:var(--amber); font-size:12px;}
  .goal-icon{font-size:16px; flex:0 0 auto;}
  @keyframes checkPop{ from{transform:scale(0);} to{transform:scale(1);} }
  .goal .chk .mark{display:inline-block; animation:checkPop .2s ease;}
  .goal-reason-panel{margin-top:10px; padding:10px; background:var(--bg); border-radius:10px;}
  .reason-chip{font-size:13px; padding:6px 10px;}

  /* بطاقة الصلاة */
  .prayer-summary-row{display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer;}
  .prayer-summary-text{font-weight:700; color:var(--ink);}
  .prayer-summary-remain{font-size:13px; color:var(--moss); font-weight:700;}
  .prayer-list{margin-top:12px; padding-top:8px; border-top:1px solid var(--line);}
  .prayer-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 4px; border-bottom:1px solid var(--line);}
  .prayer-row:last-child{border-bottom:0;}
  .prayer-row.next .prayer-name, .prayer-row.next .prayer-time{color:var(--moss); font-weight:700;}
  .prayer-row.past .prayer-name, .prayer-row.past .prayer-time{color:var(--soft);}
  .prayer-name{display:flex; align-items:center; gap:6px;}
  .prayer-alert{width:8px; height:8px; border-radius:50%; background:var(--amber); display:inline-block; flex:0 0 auto;}
  .week-review-btn{position:relative;}
  .week-alert-dot{
    position:absolute; top:-3px; left:-3px; width:9px; height:9px;
    border-radius:50%; background:var(--amber);
  }
  .prayer-time{display:flex; align-items:center; gap:8px; direction:ltr;}
  .prayer-mini-row{display:flex; gap:6px; margin:4px 0 14px;}
  .prayer-mini{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; border-radius:10px; border:1px solid var(--line); background:#fff;
    padding:8px 2px; cursor:pointer; transition:.15s;
  }
  .prayer-mini-name{font-size:11px; color:var(--soft);}
  .prayer-mini-mark{font-size:15px; font-weight:700; min-height:17px; color:var(--ink);}
  .prayer-mini.ontime{background:var(--moss); border-color:var(--moss);}
  .prayer-mini.late{background:var(--amber); border-color:var(--amber);}
  .prayer-mini.missed{background:var(--plum); border-color:var(--plum);}
  .prayer-mini.ontime .prayer-mini-name, .prayer-mini.ontime .prayer-mini-mark,
  .prayer-mini.late .prayer-mini-name, .prayer-mini.late .prayer-mini-mark,
  .prayer-mini.missed .prayer-mini-name, .prayer-mini.missed .prayer-mini-mark{color:#fff;}
  .prayer-mini.not-due{opacity:.4; cursor:default;}
  .prayer-mini.needs-alert{border-width:2px; border-color:rgba(184,134,47,.6);}
  .prayer-adjust-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:6px;}
  .prayer-adjust-item{display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:6px 10px;}
  .prayer-adjust-item input{width:56px; margin:0; padding:6px; text-align:center;}
  .prayer-manual-grid{margin-top:8px;}
  .repair-field{background:rgba(76,107,82,.08); border:1px solid rgba(76,107,82,.25); border-radius:12px; padding:10px 12px; margin-top:14px;}
  .repair-field label{color:var(--moss); font-weight:700;}

  /* شاشة اختيار وقت التذكير لكل هدف */
  .ics-row{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 4px; border-bottom:1px solid var(--line);}
  .ics-row:last-child{border-bottom:0;}
  .ics-row select{max-width:140px; margin:0;}

  /* عدّادات جسدي */
  .stepper{display:flex; align-items:center; gap:14px; justify-content:center; margin:10px 0;}
  .stepper button{
    width:46px; height:46px; border-radius:50%; border:1px solid var(--line);
    background:#fff; font-size:24px; color:var(--ink); line-height:1;
  }
  .stepper .val{font-size:30px; font-weight:700; min-width:70px; text-align:center;}
  .stepper .val small{font-size:14px; color:var(--soft); font-weight:400; display:block;}

  input[type=text], input[type=number], textarea, select{
    width:100%; font-family:inherit; font-size:15px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-top:6px;
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--sky);}
  label.fld{display:block; font-size:14px; color:var(--soft); margin-top:12px;}

  .btn{
    background:var(--plum); color:#fff; border:0; border-radius:12px;
    padding:11px 16px; font-size:15px; font-weight:700;
  }
  .btn.ghost{background:#fff; color:var(--plum); border:1px solid var(--plum);}
  .btn.moss{background:var(--moss);}
  .btn.small{padding:7px 12px; font-size:13px;}
  .guide-link{display:block; width:100%; text-align:center; margin-bottom:8px; box-sizing:border-box; text-decoration:none;}
  .guide-link:last-child{margin-bottom:0;}
  .row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
  .row > *{flex:1;}
  .row .grow0{flex:0 0 auto;}

  /* الوجبات */
  .meal{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 4px; border-bottom:1px solid var(--line);
  }
  .meal:last-child{border-bottom:0;}
  .meal .g{color:var(--moss); font-weight:700;}
  .meal .del{background:none; border:0; color:var(--soft); font-size:18px;}

  /* مكتبة الطعام */
  .food-box{border:1px solid var(--line); border-radius:12px; margin-top:8px; overflow:hidden; background:#fff;}
  .food-box input[type=text]{margin:0; border:0; border-bottom:1px solid var(--line); border-radius:0;}
  .food-list{max-height:280px; overflow-y:auto;}
  .food-group{font-size:12px; font-weight:700; color:var(--soft); background:var(--bg); padding:6px 10px;}
  .food-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    background:none; border:0; border-bottom:1px solid var(--line); border-radius:0;
    padding:9px 10px; font-family:inherit; font-size:14px; color:var(--ink); text-align:right;
  }
  .food-row:last-child{border-bottom:0;}
  .food-row:active{background:var(--bg);}
  .food-row .macros{color:var(--soft); font-size:12px; white-space:nowrap; flex:0 0 auto;}
  .food-row .macros b{color:var(--moss); font-weight:700;}
  .food-empty{padding:14px 10px; color:var(--soft); font-size:13px;}

  /* عدّادا البروتين والسعرات */
  .dual-stat{display:flex; gap:12px; margin-top:6px;}
  .dstat{flex:1; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
  .dstat-label{font-size:12px; color:var(--soft); font-weight:700;}
  .dstat-val{font-size:19px; font-weight:700; margin:2px 0 6px;}
  .dstat-val small{font-size:12px; color:var(--soft); font-weight:400;}

  /* تبويبات فرعية (جسدي: يومي / وصفاتي) */
  .subtabs{display:flex; gap:8px; margin-bottom:12px;}
  .subtab{
    flex:1; background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:9px; font-size:14px; font-weight:700; color:var(--soft);
  }
  .subtab.active{background:var(--plum); border-color:var(--plum); color:#fff;}

  /* الوصفات */
  .recipe-list{display:flex; flex-direction:column; gap:10px;}
  .recipe-card{
    display:flex; flex-direction:column; gap:10px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius); padding:12px;
  }
  .recipe-card-top{display:flex; align-items:center; gap:10px;}
  .recipe-thumb{
    width:56px; height:56px; border-radius:10px; overflow:hidden; flex:0 0 auto;
    background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .recipe-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .recipe-info{flex:1; min-width:0;}
  .recipe-name{font-weight:700; font-size:15px;}
  .recipe-macros{font-size:12px; margin-top:2px;}
  .recipe-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .recipe-preview{margin-top:8px;}
  .recipe-preview img{max-width:160px; border-radius:12px; display:block;}
  .ing-rows{margin-top:6px;}
  .ing-row{display:flex; gap:6px; margin-bottom:8px; align-items:center;}
  .ing-row input, .ing-row select{margin-top:0;}
  .ing-row input[type=number]{max-width:70px;}
  .ing-row select{max-width:88px; flex:0 0 auto;}
  .ing-warn{background:none; border:0; font-size:16px; padding:0 2px; flex:0 0 auto; line-height:1;}
  .ing-add-panel{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px; margin:-2px 0 10px;}
  .ing-add-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px;}
  .ing-add-grid input{margin-top:0;}
  .import-box{border:1px dashed var(--line); border-radius:12px; padding:10px; margin-top:6px;}
  .import-box textarea{min-height:80px; margin-top:0;}

  /* المجاميع الغذائية للوصفة */
  .nut-box{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin:8px 0 4px;}
  .nut-row{display:flex; justify-content:space-between; padding:4px 0; font-size:13px; border-bottom:1px dashed var(--line);}
  .nut-row:last-child{border-bottom:0;}
  .nut-label{color:var(--soft); font-weight:700;}

  /* أطفال */
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:99px; padding:7px 13px; font-size:14px;
  }
  .chip.on{background:var(--amber); border-color:var(--amber); color:#fff;}
  .chip.scold.on{background:var(--plum); border-color:var(--plum);}
  .kid-head{display:flex; align-items:center; gap:10px;}
  .kid-badge{width:34px; height:34px; border-radius:50%; background:var(--sky); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700;}

  /* أهدافي معه */
  .kg-list{margin-top:4px;}
  .kg-item{display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--line);}
  .kg-item:last-child{border-bottom:0;}
  /* تبويب ليلتي */
  .night-top{padding-bottom:14px;}
  .night-count{font-size:13px; color:var(--soft); margin-bottom:8px;}
  .night-bar{height:3px; border-radius:99px; background:var(--line); overflow:hidden;}
  .night-bar span{display:block; height:100%; background:var(--moss); transition:width .3s;}
  .night-h{font-size:12px; color:var(--soft); margin-bottom:8px;}
  .night-close{width:100%; margin:4px 0 20px; padding:15px; font-size:16px;}
  .night-farewell{text-align:center; padding:40px 20px; font-size:19px; color:var(--moss);}
  .night-veil{text-align:center; padding:36px 20px; font-size:16px; color:var(--soft);}
  .night-veil.reveal{color:var(--moss);}

  /* شاشة مراقبة المسؤوليات */
  .resp-times{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .resp-times select{width:100%;}
  .resp-table{width:100%;}
  .resp-row, .growth-row{display:grid; grid-template-columns:minmax(38px,1fr) repeat(7,1fr); gap:4px; align-items:center; margin-bottom:5px;}
  .touch-row{display:grid; grid-template-columns:minmax(38px,1fr) repeat(5,1fr); gap:5px; align-items:center; margin-bottom:6px;}
  .resp-head{margin-bottom:7px;}
  .resp-th{font-size:15px; line-height:1.2; text-align:center; cursor:pointer; user-select:none; -webkit-user-select:none;}
  .resp-name{font-size:11px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .resp-cell{
    aspect-ratio:1; width:100%; border-radius:7px;
    border:1.5px solid var(--line); background:#fff; cursor:pointer; transition:.12s;
  }
  .resp-row-wrap{margin-bottom:4px;}
  .resp-row-wrap .resp-row{margin-bottom:2px;}
  .resp-all-btn{
    display:block; margin-inline-start:auto; font-size:10px; color:var(--soft);
    background:none; border:0; padding:2px 4px; cursor:pointer;
  }
  .resp-tip{
    background:var(--ink); color:#fff; font-size:12px; text-align:center;
    border-radius:8px; padding:6px 10px; margin-bottom:8px;
  }
  .growth-cell{
    aspect-ratio:1; width:100%; border-radius:7px; background:var(--bg); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--ink);
  }
  .growth-cell.low{background:rgba(76,107,82,.12);}
  .growth-cell.mid{background:rgba(76,107,82,.4); color:#fff;}
  .growth-cell.high{background:var(--moss); color:#fff;}
  .resp-legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; font-size:12px; color:var(--soft);}
  .resp-legend-item{display:flex; align-items:center; gap:5px;}
  .resp-swatch{width:11px; height:11px; border-radius:3px; display:inline-block;}
  .kid-detail-card{padding-top:12px; padding-bottom:12px;}
  .kid-detail-head{
    display:flex; align-items:center; justify-content:space-between;
    font-size:15px; font-weight:700; cursor:pointer;
  }
  .kid-detail-arrow{font-size:11px; color:var(--soft);}

  /* دوري كمعلّمة — سلّم الانسحاب */
  .ladder-row{padding:10px 0; border-bottom:1px solid var(--line);}
  .ladder-row:last-child{border-bottom:0;}
  .ladder-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .ladder-name{font-size:14px; font-weight:700;}
  .ladder-btns{display:flex; gap:6px;}
  .ladder-btn{
    width:28px; height:28px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-size:14px; cursor:pointer;
  }
  .ladder-btn:disabled{opacity:.3; cursor:default;}
  .ladder-dots{display:flex; gap:5px; margin:8px 0 4px;}
  .ladder-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:#fff;}
  .ladder-dot.on{background:#4C6B52; border-color:#4C6B52;}
  .ladder-level-label{font-size:12px; color:var(--ink);}
  .ladder-form{background:var(--bg); border-radius:10px; padding:12px; margin:10px 0;}
  .ladder-stat-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 2px; border-bottom:1px solid var(--line); font-size:13px;}
  .ladder-stat-row:last-child{border-bottom:0;}
  .stopped-row{padding:7px 2px; border-bottom:1px solid var(--line); font-size:13px;}
  .stopped-row:last-child{border-bottom:0;}
  .stopped-date{color:var(--soft); font-size:12px;}

  /* قائمة الغد */
  .tomorrow-field-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .tomorrow-num{
    width:22px; height:22px; border-radius:50%; background:var(--bg); color:var(--soft);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:0 0 auto;
  }
  .tomorrow-field-row input{flex:1;}
  .tomorrow-picker{margin-top:10px; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .tomorrow-picker-item{padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer;}
  .tomorrow-picker-item:last-child{border-bottom:0;}
  .tomorrow-picker-item:active{background:var(--bg);}
  .tomorrow-unfinished-row{background:var(--bg); border-radius:10px; padding:10px 12px; margin-bottom:10px;}

/* جدول الوحدات: 1 = الكمية بالغرام مباشرة، 'serv' = اضرب الكمية في وزن الحصة (آخر عنصر في صف المكوّن) */
const UNITS={'غ':1,'غرام':1,'حبة':'serv','كوب':'serv','ملعقة':'serv','حصة':'serv','قطعة':'serv'};

/* ---- الكتابة السريعة: "٢ بيضة" / "كوب أرز" / "١٥٠ غ صدر دجاج" ---- */
function findIngredient(term){
  term=(term||"").trim();
  if(!term) return null;
  const pool=allIngredients();
  const exact=pool.find(r=>r[0]===term);
  if(exact) return exact;
  return pool.find(r=>r[0].includes(term) || term.includes(r[0])) || null;
}
function unitToGrams(qty, unitWord, ing){
  const u=UNITS[unitWord];
  if(u===undefined) return null;
  if(u===1) return qty;
  if(u==="serv") return qty*(+ing[7]||0);
  return null;
}
function parseQuickEntry(text){
  text=(text||"").trim();
  if(!text) return null;
  const arDigits="٠١٢٣٤٥٦٧٨٩";
  text=text.replace(/[٠-٩]/g, d=>arDigits.indexOf(d));
  const m=text.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  let qty=1, rest=text;
  if(m){ qty=parseFloat(m[1].replace(",",".")); rest=m[2].trim(); }
  if(!rest) return null;
  const parts=rest.split(/\s+/);
  let unitWord, nameTerm;
  if(Object.prototype.hasOwnProperty.call(UNITS, parts[0])){
    unitWord=parts[0]; nameTerm=parts.slice(1).join(" ");
  }else{
    unitWord="حبة"; nameTerm=rest;
  }
  if(!nameTerm) return null;
  const ing=findIngredient(nameTerm);
  if(!ing) return {error:"notfound", term:nameTerm};
  const grams=unitToGrams(qty, unitWord, ing);
  if(!grams) return {error:"unit"};
  const factor=grams/100;
  return {
    name:ing[0],
    grams:Math.round(grams),
    p:Math.round(ing[2]*factor),
    c:Math.round(ing[1]*factor)
  };
}

const CATCH_WHEN = [
  {id:"afterschool", label:"عند عودته من المدرسة", from:13, to:17},

const CATCH_ARCHIVE_MS = 48*3600*1000;
function loadCatch(){
  let list;
  try{ const raw=localStorage.getItem(CATCH_KEY); list = raw?JSON.parse(raw):null; }
  catch(e){ console.warn(e); list=null; }
  if(!list) list=[];
  // أرشفة تلقائية: أي بند لم يُلمَس بعد ٤٨ ساعة يفقد فائدته ويُخفى
  const now=Date.now();
  let changed=false;
  list.forEach(c=>{
    if(!c.archived && now-c.created>CATCH_ARCHIVE_MS){ c.archived=true; changed=true; }
  });
  if(changed) saveCatch(list);
  return list;
}
function saveCatch(list){ try{ localStorage.setItem(CATCH_KEY, JSON.stringify(list)); }catch(e){ console.warn(e); } }
function catchWhenLabel(id){ const w=CATCH_WHEN.find(x=>x.id===id); return w?w.label:id; }
function catchIsDueNow(when){
  const w=CATCH_WHEN.find(x=>x.id===when); if(!w) return false;
  const now=new Date();
  const h=now.getHours()+now.getMinutes()/60;
  return h>=w.from && h<w.to;
}
function catchNextWhen(when){
  const order=["afterschool","dinner","night","morning"];
  const idx=order.indexOf(when);
  return order[(idx+1)%order.length];
}
function kinIsDue(item, todayKeyStr, todayWd){
  if(item.cycle==="monthly"){
    if(!item.last) return true;
    return daysBetween(item.last, todayKeyStr)>=30;
  }
  if(todayWd!==item.day) return false;
  if(item.id==="kids-msg") return true; // يبقى ظاهراً طوال يومه بصرف النظر عمّن أرسل فعلاً
  if(!item.last) return true;
  return item.last < weekStartKey(new Date());
}
function kinDaysUntilDue(item, todayKeyStr, todayWd){
  if(item.cycle==="monthly"){
    if(!item.last) return 0;
    return Math.max(0, 30-daysBetween(item.last, todayKeyStr));
  }
  let diff=(item.day-todayWd+7)%7;
  if(diff===0) diff=7; // اليوم هو يومه لكنه أُنجز هذا الأسبوع بالفعل
  return diff;
}

/* هل يحتاج بند صلة الرحم لموعد تذكير هذا الأسبوع؟ (تخطيط مسبق، بصرف النظر عن يومه بالضبط) */
function kinNeedsPlanning(item){
  const todayKeyStr=todayKey(), todayWd=new Date().getDay();
  if(item.cycle==="monthly"){
    return kinIsDue(item, todayKeyStr, todayWd) || kinDaysUntilDue(item, todayKeyStr, todayWd)<=7;
  }
  return !item.last || item.last < weekStartKey(new Date());
}
function lastExportLabel(w){
  if(!w.lastExport) return "لم يُصدَّر بعد.";
  const wd=WD_AR[weekdayOf(w.lastExport)];
  const daysAgo=daysBetween(w.lastExport, todayKey());
  const rel = daysAgo<=0 ? "اليوم" : daysAgo===1 ? "أمس" : `قبل ${daysAgo} أيام`;
  return `آخر تصدير: ${wd} ${rel}`;
}

/* ============ حساب أوقات الصلاة فلكياً (بلا إنترنت) ============
   الخطوات: اليوم اليولياني ← موقع الشمس (الميل ومعادلة الزمن) ←
   زاوية الساعة لكل صلاة ← التحويل للتوقيت المحلي ← تصحيح خطوط العرض العالية. */
function ptDsin(d){ return Math.sin(d*Math.PI/180); }
function ptDcos(d){ return Math.cos(d*Math.PI/180); }
function ptDtan(d){ return Math.tan(d*Math.PI/180); }
function ptArcsin(x){ return Math.asin(x)*180/Math.PI; }
function ptArccos(x){ return Math.acos(x)*180/Math.PI; }
function ptArccot(x){ return Math.atan2(1,x)*180/Math.PI; }
function ptArctan2(y,x){ return Math.atan2(y,x)*180/Math.PI; }
function ptFix(a,m){ a=a-m*Math.floor(a/m); return a<0? a+m : a; }
function ptFixAngle(a){ return ptFix(a,360); }
function ptFixHour(a){ return ptFix(a,24); }

/* اليوم اليولياني لتاريخ ميلادي */
function ptJulian(year,month,day){
  if(month<=2){ year-=1; month+=12; }
  const A=Math.floor(year/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(year+4716))+Math.floor(30.6001*(month+1))+day+B-1524.5;
}
/* ميل الشمس ومعادلة الزمن ليوم يولياني معيّن */
function ptSunPosition(jd){
  const D=jd-2451545.0;
  const g=ptFixAngle(357.529+0.98560028*D);
  const q=ptFixAngle(280.459+0.98564736*D);
  const L=ptFixAngle(q+1.915*ptDsin(g)+0.020*ptDsin(2*g));
  const e=23.439-0.00000036*D;
  const RA=ptArctan2(ptDcos(e)*ptDsin(L), ptDcos(L))/15;
  const eqt=q/15-ptFixHour(RA);
  const decl=ptArcsin(ptDsin(e)*ptDsin(L));
  return {decl, eqt};
}

/* طرق الحساب المتاحة: زاوية الفجر والعشاء (أو دقائق ثابتة بعد المغرب للعشاء) */
const PRAYER_METHODS = {
  MWL:     {name:"رابطة العالم الإسلامي", fajr:18,   isha:17},
  Egypt:   {name:"الهيئة المصرية العامة للمساحة", fajr:19.5, isha:17.5},
  ISNA:    {name:"الجمعية الإسلامية لأمريكا الشمالية", fajr:15, isha:15},
  Karachi: {name:"جامعة العلوم الإسلامية — كراتشي", fajr:18, isha:18},
  Makkah:  {name:"أمّ القرى — مكة المكرمة", fajr:18.5, isha:null, ishaMinutes:90}
};
const PRAYER_ORDER = ["fajr","dhuhr","asr","maghrib","isha"];
const PRAYER_LABELS = {fajr:"الفجر", dhuhr:"الظهر", asr:"العصر", maghrib:"المغرب", isha:"العشاء"};

/* الحساب الفلكي الكامل لصلوات يوم واحد، بتوقيت محلي، مع تصحيح خطوط العرض العالية */
function computePrayerTimesAstro(dateObj, lat, lng, tz, method){
  const y=dateObj.getFullYear(), m=dateObj.getMonth()+1, d=dateObj.getDate();
  const jDate=ptJulian(y,m,d)-lng/(15*24);

  function sunPos(t){ return ptSunPosition(jDate+t); }
  function midDay(t){ return ptFixHour(12-sunPos(t).eqt); }
  function sunAngleTime(angle,t,ccw){
    const decl=sunPos(t).decl;
    const noon=midDay(t);
    const val=(-ptDsin(angle)-ptDsin(decl)*ptDsin(lat))/(ptDcos(decl)*ptDcos(lat));
    if(val<-1||val>1) return NaN;
    const tt=ptArccos(val)/15;
    return noon+(ccw?-tt:tt);
  }
  function asrTime(factor,t){
    const decl=sunPos(t).decl;
    const angle=-ptArccot(factor+ptDtan(Math.abs(lat-decl)));
    return sunAngleTime(angle,t,false);
  }

  let fajr    = sunAngleTime(method.fajr, 5/24, true);
  let sunrise = sunAngleTime(0.833, 6/24, true);
  let dhuhr   = midDay(12/24);
  let asr     = asrTime(1, 13/24); // ظلّ المثل (مذهب الجمهور)
  let sunset  = sunAngleTime(0.833, 18/24, false);
  let isha    = method.ishaMinutes!=null ? NaN : sunAngleTime(method.isha, 18/24, false);

  const shift = tz - lng/15; // التحويل من زاوية الساعة إلى التوقيت المحلي
  fajr+=shift; sunrise+=shift; dhuhr+=shift; asr+=shift; sunset+=shift;
  if(!isNaN(isha)) isha+=shift;
  let maghrib = sunset;

  // قاعدة خطوط العرض العالية «التقسيم على الزاوية» — ضرورية لآخن في الصيف
  function timeDiff(t1,t2){ return ptFixHour(t2-t1); }
  const nightTime = timeDiff(sunset, sunrise);
  const fajrDiff = (method.fajr/60)*nightTime;
  if(isNaN(fajr) || timeDiff(fajr, sunrise) > fajrDiff) fajr = sunrise - fajrDiff;

  if(method.ishaMinutes!=null){
    isha = maghrib + method.ishaMinutes/60;
  }else{
    const ishaDiff = (method.isha/60)*nightTime;
    if(isNaN(isha) || timeDiff(sunset, isha) > ishaDiff) isha = sunset + ishaDiff;
  }

  return {
    fajr: ptFixHour(fajr), dhuhr: ptFixHour(dhuhr), asr: ptFixHour(asr),
    maghrib: ptFixHour(maghrib), isha: ptFixHour(isha)
  };
}

function parseHM(s){
  if(!s) return null;
  const m=/^(\d{1,2}):(\d{2})$/.exec(String(s).trim());
  if(!m) return null;
  return (+m[1])+(+m[2])/60;
}
function fmtClock(h){
  if(h==null||isNaN(h)) return "—";
  h=ptFixHour(h);
  let hh=Math.floor(h), mm=Math.round((h-hh)*60);
  if(mm===60){ mm=0; hh=(hh+1)%24; }
  return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}
/* جدول صلوات يوم مُعطى حسب إعدادات المستخدمة (حساب فلكي أو أوقات يدوية) */
function getPrayerSchedule(dateObj){
  const P=state.prayer;
  const raw={};
  if(P.manual){
    PRAYER_ORDER.forEach(k=>{ raw[k]=parseHM(P.manualTimes[k]); });
  }else{
    const method=PRAYER_METHODS[P.method]||PRAYER_METHODS.MWL;
    const tz=-dateObj.getTimezoneOffset()/60;
    const computed=computePrayerTimesAstro(dateObj, +P.lat, +P.lng, tz, method);
    PRAYER_ORDER.forEach(k=>{ raw[k]=computed[k]+(+P.adjustments[k]||0)/60; });
  }
  return PRAYER_ORDER.map(k=>({key:k, label:PRAYER_LABELS[k], hours:raw[k]}));
}

const PRAYER_STATUS_MARK = {ontime:"✓", late:"~", missed:"✕"};
/* صفّ أفقي مضغوط للصلوات الخمس داخل صعيد رامة */
/* allOpen: في شاشة «ليلتي» كل الصلوات قابلة للضغط وبلا إطار تنبيه — الليل مضى عليها كلها */
function buildPrayerMiniRow(day, todaySchedule, nowH, allOpen){
  const boxes = PRAYER_ORDER.map(key=>{
    const p = todaySchedule.find(x=>x.key===key);
    const hours = p ? p.hours : NaN;
    const isDue = allOpen || (!isNaN(hours) && hours<=nowH);
    const status = day.prayerStatus[key];
    const needsAlert = !allOpen && isDue && !status;
    let cls = "prayer-mini";
    if(!isDue) cls += " not-due";
    else if(status) cls += " "+status;
    if(needsAlert) cls += " needs-alert";
    const clickAttr = isDue ? ` data-action="prayerStatusCycle" data-key="${key}"` : "";
    return `<div class="${cls}"${clickAttr}>
      <div class="prayer-mini-name">${PRAYER_LABELS[key]}</div>
      <div class="prayer-mini-mark">${status?PRAYER_STATUS_MARK[status]:""}</div>
    </div>`;
  }).join("");
  return `<div class="prayer-mini-row">${boxes}</div>`;
}

/* ============ تصدير تذكيرات الأهداف كملف .ics للتقويم ============ */
const ICS_PRESET_TIMES = ["06:00","08:00","14:00","18:00","20:00","21:30"];
const ICS_DAY_CODES = ["SU","MO","TU","WE","TH","FR","SA"];
const CAT_DEFAULT_TIME = {
  "المرتكز":"08:00", "روحي":"06:00", "جسدي":"18:00",
  "كأم":"18:00", "كزوجة":"20:00", "صِلة الرحم":"20:00"
};

function stableHash(str){
  let h=5381;
  for(let i=0;i<str.length;i++){ h=((h*33)^str.charCodeAt(i))>>>0; }
  return h.toString(36);
}
function pad2(n){ return String(n).padStart(2,"0"); }
function icsUTCTimestamp(d){
  return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+"T"
    +pad2(d.getUTCHours())+pad2(d.getUTCMinutes())+pad2(d.getUTCSeconds())+"Z";
}
function icsLocalTimestamp(d){
  // بلا Z: توقيت "عائم" يفهمه التقويم بحسب المنطقة الزمنية المحلية للجهاز
  return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+"T"
    +pad2(d.getHours())+pad2(d.getMinutes())+"00";
}
function icsEscape(s){
  return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}
/* طيّ السطر كل ٧٥ بايت حسب RFC5545 (وليس ٧٥ حرفاً — العربية متعددة البايتات) */
function icsFoldLine(line){
  const enc=new TextEncoder();
  if(enc.encode(line).length<=75) return line;
  const out=[]; let buf=""; let bytes=0;
  for(const ch of line){
    const chBytes=enc.encode(ch).length;
    if(bytes+chBytes>75){ out.push(buf); buf=""; bytes=0; }
    buf+=ch; bytes+=chBytes;
  }
  out.push(buf);
  return out.join("\r\n ");
}
/* أقرب تاريخ قادم يقع في أحد أيام الأسبوع المحدَّدة، بالساعة والدقيقة المطلوبتين */
function earliestUpcomingDate(days, hh, mm){
  const now=new Date();
  let best=null;
  days.forEach(wd=>{
    const d=new Date(now);
    d.setHours(hh, mm, 0, 0);
    let diff=(wd-now.getDay()+7)%7;
    if(diff===0 && d<=now) diff=7;
    d.setDate(d.getDate()+diff);
    if(!best || d<best) best=d;
  });
  return best;
}
function buildICS(entries){
  const dtstamp=icsUTCTimestamp(new Date());
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mutabaati//Goals Reminders//AR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  entries.forEach(ent=>{
    const [hh,mm]=ent.time.split(":").map(Number);
    let anchor, rrule;
    if(ent.cycle==="monthly"){
      anchor=new Date(); anchor.setHours(hh,mm,0,0);
      if(anchor<=new Date()) anchor.setDate(anchor.getDate()+1);
      rrule="RRULE:FREQ=MONTHLY";
    }else{
      if(!ent.days || !ent.days.length) return;
      anchor=earliestUpcomingDate(ent.days, hh, mm);
      if(!anchor) return;
      rrule="RRULE:FREQ=WEEKLY;BYDAY="+ent.days.map(d=>ICS_DAY_CODES[d]).join(",");
    }
    const dtEndDate=new Date(anchor.getTime()+15*60000);
    const uid=`mutabaati-${stableHash(ent.name)}@mutabaati.local`;

    lines.push(icsFoldLine("BEGIN:VEVENT"));
    lines.push(icsFoldLine("UID:"+uid));
    lines.push(icsFoldLine("DTSTAMP:"+dtstamp));
    lines.push(icsFoldLine("DTSTART:"+icsLocalTimestamp(anchor)));
    lines.push(icsFoldLine("DTEND:"+icsLocalTimestamp(dtEndDate)));
    lines.push(icsFoldLine(rrule));
    lines.push(icsFoldLine("SUMMARY:"+icsEscape(ent.name)));
    lines.push("BEGIN:VALARM");
    lines.push("ACTION:DISPLAY");
    lines.push(icsFoldLine("DESCRIPTION:"+icsEscape(ent.name)));
    lines.push("TRIGGER:-PT5M");
    lines.push("END:VALARM");
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadICS(content, filename){
  const blob=new Blob([content], {type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename||"mutabaati-goals.ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============ طقس أسبوعي: ملف .ics واحد بأحداث مؤرَّخة (بلا RRULE) ============ */
function addDays(dateObj, n){ const d=new Date(dateObj); d.setDate(d.getDate()+n); return d; }
/* حدث واحد مؤرَّخ (لا يتكرّر) — يُستعمل لكل أحداث الطقس الأسبوعي */
function icsSingleEvent(uid, dtstamp, start, durationMin, summary, description, alarmMin){
  const end=new Date(start.getTime()+durationMin*60000);
  const lines=[];
  lines.push(icsFoldLine("BEGIN:VEVENT"));
  lines.push(icsFoldLine("UID:"+uid));
  lines.push(icsFoldLine("DTSTAMP:"+dtstamp));
  lines.push(icsFoldLine("DTSTART:"+icsLocalTimestamp(start)));
  lines.push(icsFoldLine("DTEND:"+icsLocalTimestamp(end)));
  lines.push(icsFoldLine("SUMMARY:"+icsEscape(summary)));
  lines.push(icsFoldLine("DESCRIPTION:"+icsEscape(description||summary)));
  lines.push(icsFoldLine("CATEGORIES:"+icsEscape("متابعتي")));
  lines.push("BEGIN:VALARM");
  lines.push("ACTION:DISPLAY");
  lines.push(icsFoldLine("DESCRIPTION:"+icsEscape(description||summary)));
  lines.push("TRIGGER:-PT"+Math.max(0,+alarmMin||0)+"M");
  lines.push("END:VALARM");
  lines.push("END:VEVENT");
  return lines;
}
/* يبني ملف .ics الكامل لطقس الأسبوع، ويُرجع أيضاً عدد كل نوع للملخّص بعد التصدير */
function buildWeeklyRitualICS(){
  const w=weeklySettings();
  const times=loadTimes();
  const dtstamp=icsUTCTimestamp(new Date());
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mutabaati//Weekly Ritual//AR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  let prayerCount=0, goalCount=0, kinCount=0;
  const today=new Date(); today.setHours(0,0,0,0);

  // أ. الصلوات — أوقات فعلية كل يوم من السبعة القادمة، بلا تكرار
  if(w.prayerExport){
    for(let i=0;i<7;i++){
      const dateObj=addDays(today,i);
      const dateKeyStr=fmt(dateObj);
      getPrayerSchedule(dateObj).forEach(p=>{
        if(p.hours==null || isNaN(p.hours)) return;
        const start=new Date(dateObj);
        const hh=Math.floor(p.hours), mm=Math.round((p.hours-hh)*60);
        start.setHours(hh,mm,0,0);
        const desc=w.prayerText.replace("{الصلاة}", p.label);
        const uid=`mutabaati-prayer-${dateKeyStr}-${p.key}@mutabaati.local`;
        lines.push(...icsSingleEvent(uid, dtstamp, start, 15, p.label, desc, w.prayerBefore));
        prayerCount++;
      });
    }
  }

  // ب. الأهداف الشغّالة ذات موعد محفوظ، في أيامها خلال الأسبوع القادم فقط
  state.goals.filter(g=>g.active).forEach(g=>{
    const t=times[g.id]; if(!t) return;
    const [hh,mm]=t.split(":").map(Number);
    for(let i=0;i<7;i++){
      const dateObj=addDays(today,i);
      if(!g.days.includes(dateObj.getDay())) continue;
      const start=new Date(dateObj); start.setHours(hh,mm,0,0);
      const dateKeyStr=fmt(dateObj);
      const uid=`mutabaati-goal-${dateKeyStr}-${stableHash(g.name)}@mutabaati.local`;
      lines.push(...icsSingleEvent(uid, dtstamp, start, 15, g.name, g.name, 5));
      goalCount++;
    }
  });

  // ج. صلة الرحم — بنود مستحقّة هذا الأسبوع/الشهر ذات موعد محفوظ
  loadKin().filter(kinNeedsPlanning).forEach(item=>{
    const t=times["kin:"+item.id]; if(!t) return;
    const [hh,mm]=t.split(":").map(Number);
    let dateObj;
    if(item.cycle==="monthly"){
      dateObj=addDays(today, kinDaysUntilDue(item, todayKey(), today.getDay()));
    }else{
      dateObj=addDays(today, (item.day-today.getDay()+7)%7);
    }
    const start=new Date(dateObj); start.setHours(hh,mm,0,0);
    const dateKeyStr=fmt(dateObj);
    const desc="حان وقت صلة الرحم — "+item.title;
    const uid=`mutabaati-kin-${dateKeyStr}-${stableHash(item.title)}@mutabaati.local`;
    lines.push(...icsSingleEvent(uid, dtstamp, start, 15, item.title, desc, 5));
    kinCount++;
  });

  // د. حدث ثابت: الأحد القادم ٢٠:٣٠ — يضمن استمرار الطقس
  const nextSunday=addDays(today, (7-today.getDay())%7 || 7);
  nextSunday.setHours(20,30,0,0);
  const ritualUid=`mutabaati-ritual-${fmt(nextSunday)}@mutabaati.local`;
  lines.push(...icsSingleEvent(ritualUid, dtstamp, nextSunday, 15, "رتّبي أسبوعكِ", "رتّبي أسبوعكِ", 5));

  lines.push("END:VCALENDAR");
  return {ics: lines.join("\r\n"), prayerCount, goalCount, kinCount};
}

/* ============ الحالة والتخزين ============ */
const STORAGE_KEY = "mutabaati_v1";
let state = load();
let currentTab = "today";

function genId(){ return "g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const s = JSON.parse(raw); return migrate(s); }
  }catch(e){ console.warn("تعذّر تحميل البيانات:",e); }
  return freshState();
}
function freshPrayerSettings(){
  return {
    lat:50.7753, lng:6.0839, method:"MWL",
    adjustments:{fajr:0, dhuhr:0, asr:0, maghrib:0, isha:0},
    manual:false,
    manualTimes:{fajr:"", dhuhr:"", asr:"", maghrib:"", isha:""}
  };
}
function freshState(){
  const defaultNames=new Set(DEFAULT_GOALS.map(g=>g[0]));
  return {
    version:1,
    proteinTarget:100,
    calorieTarget:1900,
    goals: BANK.map(b=>({id:genId(), name:b.name, category:b.category, days:b.days.slice(), active:defaultNames.has(b.name)})),
    days:{},
    settings:{hideResults:true}, // مفعّل افتراضياً للمستخدمة الجديدة أيضاً
    prayer: freshPrayerSettings()
  };
}
function migrate(s){
  s.version = s.version||1;
  s.proteinTarget = s.proteinTarget||100;
  s.calorieTarget = s.calorieTarget||1900;
  s.goals = s.goals||[];
  // حذف هدف الصلاة القديم — استُبدل بخمسة صلوات مستقلة داخل صعيد رامة
  s.goals = s.goals.filter(g=>g.name!=="الصلوات في وقتها");
  // حذف أهداف صلة الرحم القديمة — استُبدلت بنظام إيقاع خاص (mt_kin)
  s.goals = s.goals.filter(g=>g.category!=="صِلة الرحم");
  const freshPrayer=freshPrayerSettings();
  s.prayer = s.prayer||freshPrayer;
  s.prayer.lat = s.prayer.lat!=null? s.prayer.lat : freshPrayer.lat;
  s.prayer.lng = s.prayer.lng!=null? s.prayer.lng : freshPrayer.lng;
  s.prayer.method = s.prayer.method || freshPrayer.method;
  s.prayer.adjustments = Object.assign(freshPrayer.adjustments, s.prayer.adjustments||{});
  s.prayer.manual = !!s.prayer.manual;
  s.prayer.manualTimes = Object.assign(freshPrayer.manualTimes, s.prayer.manualTimes||{});
  // أضيفي أي هدف من بنك الأهداف لم يكن موجوداً بعد (يُضاف مطفأً، دون لمس ما لديها فعلاً)
  const existingNames=new Set(s.goals.map(g=>g.name));
  BANK.forEach(b=>{
    if(!existingNames.has(b.name)){
      s.goals.push({id:genId(), name:b.name, category:b.category, days:b.days.slice(), active:false});
      existingNames.add(b.name);
    }
  });
  s.days = s.days||{};
  s.settings = s.settings||{};
  if(s.settings.hideResults===undefined) s.settings.hideResults=true; // مفعّل افتراضياً
  Object.values(s.days).forEach(d=>{
    if(!d) return;
    if(d.meals){
      d.meals.forEach(m=>{
        if(m.p===undefined){ m.p=+m.grams||0; m.c=+m.calories||0; delete m.grams; delete m.calories; }
      });
    }
    // ترحيل الهدف الثنائي القديم (checks: true/false) إلى الحالة الثلاثية (done: 'yes'|'no')
    if(d.checks && !d.done){
      d.done={};
      Object.keys(d.checks).forEach(id=>{ if(d.checks[id]) d.done[id]="yes"; });
      delete d.checks;
    }
    d.reasons = d.reasons||{};
    d.detail = d.detail||{};
  });
  return s;
}

  // أي تسجيل يتمّ وشاشة «ليلتي» مفتوحة يُعلّم هذه الليلة كليلة مسجّلة

/* ============ أدوات التاريخ ============ */
function fmt(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), da=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${da}`;
}
function todayKey(){ const d=new Date(); d.setHours(0,0,0,0); return fmt(d); }
function tomorrowKey(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+1); return fmt(d); }
function weekdayOf(key){ return new Date(key+"T00:00:00").getDay(); }
function shortLabel(key){ const [y,m,d]=key.split("-"); return `${+d}/${+m}`; }
function lastNDays(n){
  const arr=[]; const d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<n;i++){ arr.unshift(fmt(d)); d.setDate(d.getDate()-1); }
  return arr;
}

/* يوم قابل للتعديل (يُنشأ ويُخزَّن عند الحاجة) */
function getDay(key){
  if(!state.days[key]){
    state.days[key] = {done:{}, reasons:{}, detail:{}, speech:"", note:"", meals:[], water:0,
      exercise:{done:false, what:"", minutes:0, steps:0}, kids:{}};
  }
  const d = state.days[key];
  d.kids = d.kids||{};
  KIDS.forEach(k=>{
    if(!d.kids[k]) d.kids[k]={special:false,praise:false,touch:false,scolded:false,what:"",next:"",
      scoldTime:[],scoldTrigger:[],scoldStyle:[],scoldState:[]};
    const kd=d.kids[k];
    kd.scoldTime=kd.scoldTime||[]; kd.scoldTrigger=kd.scoldTrigger||[];
    kd.scoldStyle=kd.scoldStyle||[]; kd.scoldState=kd.scoldState||[];
    if(kd.note===undefined) kd.note="";
    if(!kd.touch) kd.touch={wake:false, door:false, back:false, dinner:false, night:false};
  });
  d.exercise = d.exercise||{done:false,what:"",minutes:0,steps:0};
  d.meals = d.meals||[];
  d.done = d.done||{};
  d.reasons = d.reasons||{};
  d.detail = d.detail||{};
  d.home = d.home||{group:false, threat:false, threatWhat:"", kept:null, whyNot:""};
  d.home.authority = d.home.authority||{happened:false, kinds:[], who:[], what:"", repair:""};
  if(d.home.bagDue===undefined) d.home.bagDue="18:00";
  if(d.home.bagDone===undefined) d.home.bagDone="";
  if(d.home.myCleanup===undefined) d.home.myCleanup=null;
  if(d.home.interfered===undefined) d.home.interfered=null;
  if(d.home.didItFor===undefined) d.home.didItFor=null;
  if(d.home.stoppedDoing===undefined) d.home.stoppedDoing="";
  d.prayerStatus = d.prayerStatus||{fajr:null, dhuhr:null, asr:null, maghrib:null, isha:null};
  d.resp = d.resp||{}; // resp[اسم الطفل][معرّف المسؤولية] = 'alone' | 'reminded' | 'not'
  d.skin = d.skin || {
    morning:{cleanser:false, vitaminC:false, toleriane:false, spf:false},
    evening:{cleanser:false, waitDry:false, retinal:false, toleriane:false, noni:false, brightening:false},
    body:false, eyePatch:false

}

/* ============ حسابات ============ */
function scheduledGoals(key){
  const wd = weekdayOf(key);
  return state.goals.filter(g=>g.active && g.days.includes(wd));
}
function dayCompletion(key){ // {done,total}
  const sched = scheduledGoals(key);
  const d = state.days[key];
  let done=0;
  sched.forEach(g=>{ if(d && d.done && d.done[g.id]==="yes") done++; });
  return {done, total:sched.length};
}
function dayComplete(key){
  const c = dayCompletion(key);
  return c.total>0 && c.done===c.total;
}
function scoldedOn(key){
  const d=state.days[key];
  return !!(d && d.kids && Object.values(d.kids).some(k=>k.scolded));
}
function computeStreak(){
  let streak=0; const d=new Date(); d.setHours(0,0,0,0);
  if(!dayComplete(fmt(d))) d.setDate(d.getDate()-1); // اليوم غير مكتمل بعد → لا يكسر السلسلة
  let guard=0;
  while(guard++<4000){
    if(dayComplete(fmt(d))){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}
function computeAvg14(){
  const days=lastNDays(14); const vals=[];
  days.forEach(k=>{ const c=dayCompletion(k); if(c.total>0) vals.push(c.done/c.total); });
  if(!vals.length) return 0;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100);
}
function computeNoScoldStreak(){
  const keys=Object.keys(state.days).filter(k=>state.days[k]).sort();
  if(!keys.length) return 0;
  const earliest=keys[0];
  let streak=0; const d=new Date(); d.setHours(0,0,0,0);
  let guard=0;
  while(guard++<4000){
    const key=fmt(d);
    if(key < earliest) break;
    if(scoldedOn(key)) break;
    streak++; d.setDate(d.getDate()-1);
  }
  return streak;
}

/* ============ رسم بياني SVG بسيط ============ */
function barChart(values, labels, color, unit){
  const n=values.length;
  const bw=22, gap=8, padL=6, padR=6, padT=8, padB=22;
  const chartH=110;
  const W=padL+padR+n*bw+(n-1)*gap;
  const H=chartH+padT+padB;
  const max=Math.max(...values, 1);
  let bars="";
  for(let i=0;i<n;i++){
    const v=values[i];
    const h=Math.round(v/max*chartH);
    const x=padL+i*(bw+gap);
    const y=padT+chartH-h;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="4" fill="${color}" opacity="${v>0?1:.25}"></rect>`;
    if(v>0){
      bars+=`<text x="${x+bw/2}" y="${y-3}" font-size="9" fill="#6E7080" text-anchor="middle">${v}</text>`;
    }
    bars+=`<text x="${x+bw/2}" y="${H-7}" font-size="9" fill="#6E7080" text-anchor="middle">${labels[i]}</text>`;
  }
  return `<div class="chart-max">الأعلى: ${max}${unit?(" "+unit):""}</div>
    <div class="chart-wrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bars}</svg></div>`;
}

}

/* عدّاد الصلاة القادمة بصيغة كلامية — يحدّث نص العنصر مباشرة دون إعادة رسم الصفحة */
let prayerCountdownTimer=null;
function humanRemaining(ms){
  const totalMin=Math.max(0, Math.round(ms/60000));
  if(totalMin<1) return "الآن";
  const h=Math.floor(totalMin/60), m=totalMin%60;
  const parts=[];
  if(h===1) parts.push("ساعة");
  else if(h>1) parts.push(`${h} ساعات`);
  if(m>0) parts.push(`${m} دقيقة`);
  return "بعد "+parts.join(" و");
}
function startPrayerCountdown(){
  if(prayerCountdownTimer) clearInterval(prayerCountdownTimer);
  prayerCountdownTimer=setInterval(()=>{
    const el=document.getElementById("prayerSummaryRemain");
    if(!el || currentTab!=="today"){ clearInterval(prayerCountdownTimer); prayerCountdownTimer=null; return; }
    const now=new Date();
    const nowH=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
    let sched=getPrayerSchedule(now);
    let next=sched.find(p=>!isNaN(p.hours) && p.hours>nowH);
    let baseDate=new Date(now); baseDate.setHours(0,0,0,0);
    if(!next){
      const tomorrow=new Date(now); tomorrow.setDate(tomorrow.getDate()+1);
      sched=getPrayerSchedule(tomorrow);
      next=sched.find(p=>!isNaN(p.hours));
      baseDate=new Date(tomorrow); baseDate.setHours(0,0,0,0);
    }
    if(!next){ el.textContent=""; return; }
    const targetMs=baseDate.getTime()+Math.round(next.hours*3600*1000);
    const remain=targetMs-Date.now();
    if(remain<=0){ renderCurrent(); return; }
    el.textContent=humanRemaining(remain);
  }, 1000);
}

    sphereTargets[s.key]=targetOffset;

const RECIPES_KEY = "mt_recipes";
const STORAGE_SOFT_LIMIT = 4.5*1024*1024; // تنبيه عند الاقتراب من حدود التخزين التقريبية للمتصفح (~5 م.ب)
const UNIT_OPTIONS = ["غرام","حبة","كوب","ملعقة","حصة","قطعة"];

function loadRecipes(){

}
function storageUsageBytes(){
  let total=0;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    total += new Blob([k+(localStorage.getItem(k)||"")]).size;
  }
  return total;
}
function saveRecipes(list){
  try{
    localStorage.setItem(RECIPES_KEY, JSON.stringify(list));
    if(storageUsageBytes() > STORAGE_SOFT_LIMIT){
      alert("تنبيه: مساحة التخزين في المتصفح قريبة من الامتلاء. يُفضّل حذف بعض الوصفات القديمة أو صورها الكبيرة لإخلاء مساحة.");
    }

    alert("تعذّر حفظ الوصفة لأن مساحة التخزين في المتصفح امتلأت. جرّبي حذف وصفات قديمة أو صور كبيرة، ثم أعيدي المحاولة.");
    return false;
  }
}
function recipeFullTotals(ingredients){
  const t={c:0,p:0,fiber:0,iron:0,calcium:0,vitc:0};
  (ingredients||[]).forEach(row=>{
    const name=(row.name||"").trim(); if(!name) return;
    const ing=findIngredient(name); if(!ing) return;
    const grams=unitToGrams(+row.qty||0, row.unit, ing); if(!grams) return;
    const f=grams/100;
    t.c+=ing[1]*f; t.p+=ing[2]*f; t.fiber+=ing[3]*f;
    t.iron+=ing[4]*f; t.calcium+=ing[5]*f; t.vitc+=ing[6]*f;
  });
  return t;
}
function round1(n){ return Math.round((n||0)*10)/10; }
function recipePerServing(recipe){
  const t=recipeFullTotals(recipe.ingredients);
  const servings=Math.max(1, +recipe.servings||4);
  return {
    c: Math.round(t.c/servings), p: Math.round(t.p/servings),
    fiber: round1(t.fiber/servings), iron: round1(t.iron/servings),
    calcium: round1(t.calcium/servings), vitc: round1(t.vitc/servings)
  };
}
function recipeMacros(recipe){
  const s=recipePerServing(recipe);
  return { c:s.c, p:s.p };
}
function sortRecipes(list, mode){
  const arr=list.slice();
  if(mode==="protein") arr.sort((a,b)=>recipePerServing(b).p - recipePerServing(a).p);
  else if(mode==="iron") arr.sort((a,b)=>recipePerServing(b).iron - recipePerServing(a).iron);
  else if(mode==="calories") arr.sort((a,b)=>recipePerServing(a).c - recipePerServing(b).c);
  else arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return arr;
}
function buildRecipeTotalsHtml(){

  const t=recipeFullTotals(recipeDraft.ingredients);
  const servings=Math.max(1, +recipeDraft.servings||4);

}

function parseImportLine(line){
  line=(line||"").trim();
  if(!line) return null;
  const arDigits="٠١٢٣٤٥٦٧٨٩";
  const text=line.replace(/[٠-٩]/g, d=>arDigits.indexOf(d));
  const parts=text.split(/\s+/);
  if(parts.length<3) return null;
  const qty=parseFloat(parts[0].replace(",","."));
  if(isNaN(qty)) return null;
  const unit=parts[1];
  if(!Object.prototype.hasOwnProperty.call(UNITS, unit)) return null;
  const name=parts.slice(2).join(" ").trim();
  if(!name) return null;
  return {qty, unit, name};
}
function resizeImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1, maxWidth/img.width);
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function buildTouchStatsHtml(){
  const days14=lastNDays(14);
  const school=goesToSchoolSettings();

  const table={};
  KIDS.forEach(name=>{
    table[name]={};
    TOUCH_MOMENTS.forEach(m=>{
      if(m.schoolOnly && !school[name]){ table[name][m.id]=null; return; }
      let count=0;
      days14.forEach(k=>{
        const d=state.days[k]; if(!d||!d.kids||!d.kids[name]||!d.kids[name].touch) return;
        if(d.kids[name].touch[m.id]) count++;
      });
      table[name][m.id]=Math.round(count/days14.length*100);
    });
  });

  const headHtml=TOUCH_MOMENTS.map(m=>`<div class="resp-th" data-tip="${esc(m.label)}" title="${esc(m.label)}">${m.icon}</div>`).join("");
  const rowsHtml=KIDS.map(name=>{
    const cells=TOUCH_MOMENTS.map(m=>{
      const p=table[name][m.id];
      return `<div class="growth-cell ${p==null?"":respGrowthClass(p)}">${p==null?"—":p+"٪"}</div>`;
    }).join("");
    return `<div class="touch-row"><div class="resp-name">${esc(name)}</div>${cells}</div>`;
  }).join("");
  const tipHtml = respTipActive ? `<div class="resp-tip">${esc(respTipActive)}</div>` : "";

  let weakestMoment=null;
  TOUCH_MOMENTS.forEach(m=>{
    let total=0, count=0;
    KIDS.forEach(name=>{
      if(m.schoolOnly && !school[name]) return;
      days14.forEach(k=>{
        const d=state.days[k]; if(!d||!d.kids||!d.kids[name]||!d.kids[name].touch) return;
        count++; if(d.kids[name].touch[m.id]) total++;
      });
    });
    if(!count) return;
    const pct=Math.round(total/count*100);
    if(!weakestMoment || pct<weakestMoment.pct) weakestMoment={short:m.short, pct};
  });

  const kidPct={};
  KIDS.forEach(name=>{
    const applicable=TOUCH_MOMENTS.filter(m=>table[name][m.id]!=null);
    kidPct[name]=applicable.length ? applicable.reduce((s,m)=>s+table[name][m.id],0)/applicable.length : null;
  });
  const validKids=KIDS.filter(name=>kidPct[name]!=null);
  let lowestLine="";
  if(validKids.length){
    const maxP=Math.max(...validKids.map(n=>kidPct[n]));
    const minP=Math.min(...validKids.map(n=>kidPct[n]));
    if(maxP-minP>=15){
      const lowestName=validKids.find(n=>kidPct[n]===minP);
      lowestLine=`<div class="pattern-line">الأقلّ نصيباً: ${esc(lowestName)}</div>`;
    }
  }

  return `
    <div class="card">
      <h3>🤝 لحظاتي معهم — ١٤ يوماً</h3>
      ${tipHtml}
      <div class="resp-table">
        <div class="touch-row resp-head"><div class="resp-name"></div>${headHtml}</div>
        ${rowsHtml}
      </div>
      ${weakestMoment?`<div class="pattern-line" style="margin-top:10px">أضعف لحظة عندكِ: ${esc(weakestMoment.short)} (${weakestMoment.pct}٪)</div>`:""}
      ${lowestLine}
    </div>
  `;
}
function buildKidsTodayAssistantHtml(day){
  if(!respRecordedToday(day)) return "";
  const kids=respKidsList();

  let topKid=null;
  kids.forEach(name=>{
    const kr=day.resp[name]||{};
    const aloneCount=RESPONSIBILITIES.filter(r=>kr[r.id]==="alone").length;
    if(aloneCount>0 && (!topKid || aloneCount>topKid.count)) topKid={name, count:aloneCount};
  });
  const topLine = topKid
    ? `<div class="pattern-line">أعلى اليوم: ${esc(topKid.name)} — ${topKid.count} من ${RESPONSIBILITIES.length} ${KID_FEM[topKid.name]?"وحدها":"وحده"}</div>`
    : "";

  let hardest=null;
  RESPONSIBILITIES.forEach(r=>{
    let alone=0, recorded=0;
    kids.forEach(name=>{
      const st=(day.resp[name]||{})[r.id]; if(!st) return;
      recorded++; if(st==="alone") alone++;
    });
    if(!recorded) return;
    const pct=alone/recorded;
    if(!hardest || pct<hardest.pct) hardest={label:r.label, pct};
  });
  const hardestLine = hardest ? `<div class="pattern-line">الأصعب اليوم على الجميع: ${esc(hardest.label)}</div>` : "";

  const todayKeyStr=todayKey();
  let bestImprovement=null;
  kids.forEach(name=>{
    RESPONSIBILITIES.forEach(r=>{
      const todaySt=(day.resp[name]||{})[r.id];
      if(todaySt!=="alone") return;
      let streak=0;
      for(let i=1;i<=60;i++){
        const d=new Date(todayKeyStr+"T00:00:00"); d.setDate(d.getDate()-i);
        const pastDay=state.days[fmt(d)];
        const pastSt = pastDay && pastDay.resp && pastDay.resp[name] ? pastDay.resp[name][r.id] : undefined;
        if(pastSt==="alone") break; // كانت خضراء سابقاً — لا تحسّن هنا فعلياً
        if(!pastSt) break; // لا سجلّ صريح لهذا اليوم — لا دليل كافياً، فلا تخترعي تحسّناً
        streak++;
      }
      if(streak>=3 && (!bestImprovement || streak>bestImprovement.streak)){
        bestImprovement={name, label:r.label, streak};
      }
    });
  });
  const improvementLine = bestImprovement
    ? `<div class="pattern-line">تحسّن: ${esc(bestImprovement.name)} ${esc(bestImprovement.label)} وحده لأول مرة منذ ${bestImprovement.streak} أيام</div>`
    : "";

  return `
    <div class="card">
      <h3 style="margin-top:0">اليوم عندهم</h3>
      ${topLine}
      ${hardestLine}
      ${improvementLine}
    </div>
  `;
}

/* تصدير جدول مسؤوليات الأولاد بالكامل كملف CSV */
function exportKidsRespCSV(){
  const rows=[["التاريخ","الطفل","المسؤولية","الحالة"]];
  const respLabel=id=>{ const r=RESPONSIBILITIES.find(x=>x.id===id); return r?r.label:id; };
  const stLabel=id=>{ const s=RESP_STATES.find(x=>x.id===id); return s?s.label:id; };
  Object.keys(state.days).sort().forEach(dateKey=>{
    const d=state.days[dateKey]; if(!d||!d.resp) return;
    Object.keys(d.resp).forEach(name=>{
      const kr=d.resp[name];
      Object.keys(kr).forEach(rid=>{
        const st=kr[rid]; if(!st) return;
        rows.push([dateKey, name, respLabel(rid), stLabel(st)]);
      });
    });
  });
  const csvEscape=v=>{
    const s=String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const csv="﻿"+rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob=new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="mutabaati-kids-"+todayKey()+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---- تبويب: التطوّر ---- */
/* بطاقة «ما الذي يمنعني؟» — تحليل أسباب تفويت الأهداف ومواقف التوبيخ آخر ١٤ يوماً */
function buildPatternsHtml(){
  const last14 = lastNDays(14);
  const daysWithData = last14.filter(k=>{
    const d=state.days[k];
    return d && d.done && Object.keys(d.done).length>0;
  }).length;
  if(daysWithData<7){
    return `<div class="card"><h3>🔍 ما الذي يمنعني؟</h3><p class="muted">سجّلي سبعة أيام أولاً.</p></div>`;
  }

  const missCounts={}, missReasonCounts={}, allReasonCounts={};
  last14.forEach(k=>{
    const d=state.days[k]; if(!d||!d.done) return;
    Object.keys(d.done).forEach(id=>{
      if(d.done[id]!=="no") return;
      missCounts[id]=(missCounts[id]||0)+1;
      const rs=(d.reasons&&d.reasons[id])||[];
      missReasonCounts[id]=missReasonCounts[id]||{};
      rs.forEach(r=>{
        missReasonCounts[id][r]=(missReasonCounts[id][r]||0)+1;
        allReasonCounts[r]=(allReasonCounts[r]||0)+1;
      });
    });
  });
  const missedGoalIds = Object.keys(missCounts).filter(id=>missCounts[id]>=3)
    .sort((a,b)=>missCounts[b]-missCounts[a]);
  const missedLinesHtml = missedGoalIds.length ? missedGoalIds.map(id=>{
    const g=state.goals.find(x=>x.id===id);
    const name = g?g.name:"(هدف سابق)";
    const topEntry = Object.entries(missReasonCounts[id]||{}).sort((a,b)=>b[1]-a[1])[0];
    const topText = topEntry ? ` أكثر سبب: ${esc(topEntry[0])} (${topEntry[1]})` : "";
    return `<div class="pattern-line">${esc(name)} — لم تحدث ${missCounts[id]} مرات.${topText}</div>`;
  }).join("") : `<p class="muted">لا يوجد هدف تكرّر تفويته ثلاث مرات فأكثر.</p>`;

  const timeCounts={}, triggerCounts={}, styleCounts={}, stateCounts={};
  let totalScolds=0;
  last14.forEach(k=>{
    const d=state.days[k]; if(!d||!d.kids) return;
    KIDS.forEach(name=>{
      const kd=d.kids[name]; if(!kd || !kd.scolded) return;
      totalScolds++;
      (kd.scoldTime||[]).forEach(t=>timeCounts[t]=(timeCounts[t]||0)+1);
      (kd.scoldTrigger||[]).forEach(t=>triggerCounts[t]=(triggerCounts[t]||0)+1);
      (kd.scoldStyle||[]).forEach(t=>styleCounts[t]=(styleCounts[t]||0)+1);
      (kd.scoldState||[]).forEach(t=>stateCounts[t]=(stateCounts[t]||0)+1);
    });
  });
  function topOf(counts){
    const entries=Object.entries(counts);
    return entries.length ? entries.sort((a,b)=>b[1]-a[1])[0] : null;
  }
  const topTime=topOf(timeCounts), topTrigger=topOf(triggerCounts), topState=topOf(stateCounts);
  const raisedVoiceCount = styleCounts["رفعتُ صوتي"]||0;

  const scoldSectionHtml = totalScolds ? `
    <div class="section-title">التوبيخ</div>
    ${topTime?`<div class="pattern-line">أكثر وقت: ${esc(topTime[0])} — ${topTime[1]} من ${totalScolds}</div>`:""}
    ${topTrigger?`<div class="pattern-line">أكثر محفّز: ${esc(topTrigger[0])} — ${topTrigger[1]}</div>`:""}
    ${topState?`<div class="pattern-line">أكثر حالة عندي: ${esc(topState[0])} — ${topState[1]}</div>`:""}
    <div class="pattern-line">رفعتُ صوتي في ${raisedVoiceCount} من ${totalScolds} موقفاً</div>
  ` : `<div class="section-title">التوبيخ</div><p class="muted">لا توجد مواقف توبيخ مسجّلة.</p>`;

  let linkHtml="";
  const topOverallReason=topOf(allReasonCounts);
  if(topOverallReason && topState){
    const match=REASON_STATE_MATCH[topOverallReason[0]];
    if(match && match.state===topState[0]){
      linkHtml = `<div class="pattern-link">${esc(match.label)} هو القاسم المشترك بين أهدافكِ الفائتة وتوبيخكِ.</div>`;
    }
  }

  // موقفي كمربّية: تصرّفات أضعفت موقف الأم
  let authorityCount=0;
  const authorityKindCounts={}, authorityWhoCounts={};
  last14.forEach(k=>{
    const d=state.days[k]; if(!d||!d.home||!d.home.authority) return;
    const auth=d.home.authority; if(!auth.happened) return;
    authorityCount++;
    (auth.kinds||[]).forEach(kk=>authorityKindCounts[kk]=(authorityKindCounts[kk]||0)+1);
    (auth.who||[]).forEach(w=>authorityWhoCounts[w]=(authorityWhoCounts[w]||0)+1);
  });
  const topAuthorityKind=topOf(authorityKindCounts), topAuthorityWho=topOf(authorityWhoCounts);
  const authoritySectionHtml = authorityCount ? `
    <div class="section-title">موقفي كمربّية</div>
    <div class="pattern-line">تصرّفات أضعفت موقفي: ${authorityCount} في ${last14.length} يوماً</div>
    ${topAuthorityKind?`<div class="pattern-line">أكثرها تكراراً: ${esc(topAuthorityKind[0])} (${topAuthorityKind[1]})</div>`:""}
    ${topAuthorityWho?`<div class="pattern-line">أكثر من تكرّرت معه: ${esc(topAuthorityWho[0])} (${topAuthorityWho[1]})</div>`:""}
    ${topAuthorityKind && topAuthorityKind[0]==="هدّدتُ ولم أنفّذ"?`<div class="pattern-line">معظم ما أضعف موقفكِ كان قولاً لم يتبعه فعل.</div>`:""}
  ` : "";

  return `
    <div class="card">
      <h3>🔍 ما الذي يمنعني؟</h3>
      ${missedLinesHtml}
      ${scoldSectionHtml}
      ${linkHtml}
      ${authoritySectionHtml}
    </div>
  `;
}

/* بطاقة «صلواتي في ١٤ يوماً» */
function buildPrayerStatsHtml(){
  const last14=lastNDays(14);
  let daysWithData=0;
  const counts={};
  PRAYER_ORDER.forEach(k=>counts[k]={ontime:0,late:0,missed:0});
  last14.forEach(k=>{
    const d=state.days[k]; if(!d||!d.prayerStatus) return;
    let hasAny=false;
    PRAYER_ORDER.forEach(p=>{
      const st=d.prayerStatus[p];
      if(st){ counts[p][st]++; hasAny=true; }
    });
    if(hasAny) daysWithData++;
  });
  const rows=PRAYER_ORDER.map(k=>({key:k, label:PRAYER_LABELS[k], ...counts[k]}))
    .sort((a,b)=>b.missed-a.missed);
  const rowsHtml=rows.map(r=>{
    const total=r.ontime+r.late+r.missed;
    const pOn=total?r.ontime/total*100:0, pLate=total?r.late/total*100:0, pMiss=total?r.missed/total*100:0;
    return `<div class="prayer-stat-row">
      <div class="prayer-stat-label">${r.label}</div>
      <div class="prayer-stat-nums">في وقتها ${r.ontime} · متأخّرة ${r.late} · فاتت ${r.missed}</div>
      <div class="prayer-stat-bar">
        <span style="width:${pOn}%; background:#4C6B52"></span><span style="width:${pLate}%; background:#B8862F"></span><span style="width:${pMiss}%; background:#7A4A63"></span>
      </div>
    </div>`;
  }).join("");
  const worst=rows[0];
  const weakestLine = (daysWithData>=7 && worst && worst.missed>0)
    ? `<div class="pattern-line">أضعف صلاة عندكِ: ${esc(worst.label)} — فاتت ${worst.missed} مرات.</div>` : "";
  return `
    <div class="card">
      <h3>🕌 صلواتي في ١٤ يوماً</h3>

/* بطاقة «من يتحمّل مسؤوليته؟» — أرقام فقط، بلا تفسير ولا نصيحة */
const KID_FEM = {"سهى":true, "سلمى":true, "سارة":true};
function fmtDuration(totalMin){
  const mins=Math.max(0, Math.round(totalMin));
  const h=Math.floor(mins/60), m=mins%60;
  const parts=[];
  if(h===1) parts.push("ساعة");
  else if(h===2) parts.push("ساعتان");
  else if(h>2) parts.push(`${h} ساعات`);
  if(m>0) parts.push(`${m} دقيقة`);
  return parts.length ? parts.join(" و") : "0 دقيقة";
}
/* أول تاريخ سُجّلت فيه أي خانة مسؤولية على الإطلاق — لبوّابة «مرّ ١٤ يوماً» */
function firstRespDateKey(){
  const keys=Object.keys(state.days).filter(k=>{
    const d=state.days[k]; if(!d||!d.resp) return false;
    return Object.values(d.resp).some(kr=>kr && Object.values(kr).some(Boolean));
  }).sort();
  return keys.length ? keys[0] : null;
}
/* نسبة «وحده» لطفل عبر مجموعة تواريخ مُعطاة، بين كل المسؤوليات المسجَّلة */
function kidAlonePct(name, dateKeys){
  let alone=0, recorded=0;
  dateKeys.forEach(k=>{
    const d=state.days[k]; if(!d||!d.resp) return;
    const kr=d.resp[name]; if(!kr) return;
    RESPONSIBILITIES.forEach(r=>{
      const st=kr[r.id]; if(!st) return;
      recorded++; if(st==="alone") alone++;
    });
  });
  return recorded ? Math.round(alone/recorded*100) : null;
}
function weekDateKeys(weeksAgo){
  const start=new Date(weekStartKey(new Date())+"T00:00:00");
  start.setDate(start.getDate()-7*weeksAgo);
  const keys=[];
  for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); keys.push(fmt(d)); }
  return keys;
}
function respGrowthClass(pct){
  if(pct==null) return "";
  if(pct<30) return "low";
  if(pct<=70) return "mid";
  return "high";
}

/* بطاقة «نموّهم» — نسبة الاستقلالية لكل طفل ومسؤولية، والأقوى/الأضعف، ومقارنة أسبوعية */
function buildKidsGrowthHtml(){
  const last14=lastNDays(14);
  const kids=respKidsList();
  const daysWithResp=last14.filter(k=>{
    const d=state.days[k];
    if(!d||!d.resp) return false;
    return kids.some(n=>d.resp[n] && Object.keys(d.resp[n]).length>0);
  }).length;
  if(daysWithResp<7){
    return `<div class="card"><h3>🌱 نموّهم</h3><p class="muted">سجّلي سبعة أيام أولاً.</p></div>`;
  }

  const tally={};
  kids.forEach(n=>{ tally[n]={}; RESPONSIBILITIES.forEach(r=>{ tally[n][r.id]={alone:0, recorded:0}; }); });
  last14.forEach(k=>{
    const d=state.days[k]; if(!d||!d.resp) return;
    kids.forEach(n=>{
      const kr=d.resp[n]; if(!kr) return;
      RESPONSIBILITIES.forEach(r=>{
        const st=kr[r.id]; if(!st) return;
        tally[n][r.id].recorded++;
        if(st==="alone") tally[n][r.id].alone++;
      });
    });
  });
  const pctOf=(a,b)=> b? Math.round(a/b*100) : null;

  // أ. جدول النسب المُلوَّن
  const headHtml=RESPONSIBILITIES.map(r=>
    `<div class="resp-th" data-tip="${esc(r.label)}" title="${esc(r.label)}">${r.icon}</div>`
  ).join("");
  const rowsHtml=kids.map(n=>{
    const cells=RESPONSIBILITIES.map(r=>{
      const p=pctOf(tally[n][r.id].alone, tally[n][r.id].recorded);
      return `<div class="growth-cell ${respGrowthClass(p)}">${p==null?"—":p+"٪"}</div>`;
    }).join("");
    return `<div class="growth-row"><div class="resp-name">${esc(n)}</div>${cells}</div>`;
  }).join("");
  const tipHtml = respTipActive ? `<div class="resp-tip">${esc(respTipActive)}</div>` : "";

  // ب. الأقوى والأضعف لكل طفل
  const strongWeakHtml = kids.map(n=>{
    let best=null, worst=null;
    RESPONSIBILITIES.forEach(r=>{
      const p=pctOf(tally[n][r.id].alone, tally[n][r.id].recorded);
      if(p==null) return;
      if(!best || p>best.p) best={label:r.label, p};
      if(!worst || p<worst.p) worst={label:r.label, p};
    });
    if(!best) return "";
    return `<div class="pattern-line">${esc(n)} — الأقوى: ${esc(best.label)} (${best.p}٪) · الأضعف: ${esc(worst.label)} (${worst.p}٪)</div>`;
  }).join("");

  // د. مقارنة أسبوعية — لا تظهر قبل مرور ١٤ يوماً على أول تسجيل
  const firstKey=firstRespDateKey();
  const daysSinceStart = firstKey ? daysBetween(firstKey, todayKey()) : 0;
  let weeklyCompareHtml="";
  if(daysSinceStart>=14){
    const thisWeekKeys=weekDateKeys(0), lastWeekKeys=weekDateKeys(1);
    const lines=kids.map(n=>{
      const cur=kidAlonePct(n, thisWeekKeys), prev=kidAlonePct(n, lastWeekKeys);
      if(cur==null || prev==null) return "";
      const arrow = cur>prev ? "↑" : cur<prev ? "↓" : "=";
      return `<div class="pattern-line">${esc(n)} — هذا الأسبوع ${cur}٪ ${arrow} الأسبوع الماضي ${prev}٪</div>`;
    }).join("");
    weeklyCompareHtml = lines ? `<div class="section-title">مقارنة أسبوعية</div>${lines}` : "";
  }

  return `
    <div class="card">
      <h3>🌱 نموّهم</h3>
      ${tipHtml}
      <div class="resp-table">
        <div class="growth-row resp-head"><div class="resp-name"></div>${headHtml}</div>
        ${rowsHtml}
      </div>
      ${strongWeakHtml}
      ${weeklyCompareHtml}
    </div>
  `;
}

/* بطاقة «خطوتي التالية» — أعلى مسؤولية بعدد «بتذكير» لكل طفل، لأنها الأقرب للاستقلال */
function buildKidsNextStepHtml(){
  const last14=lastNDays(14);
  const kids=respKidsList();
  const daysWithResp=last14.filter(k=>{
    const d=state.days[k];
    if(!d||!d.resp) return false;
    return kids.some(n=>d.resp[n] && Object.keys(d.resp[n]).length>0);
  }).length;
  if(daysWithResp<7){
    return `<div class="card"><h3>🪜 خطوتي التالية</h3><p class="muted">سجّلي سبعة أيام أولاً.</p></div>`;
  }

  const remindedCount={};
  kids.forEach(n=>{ remindedCount[n]={}; RESPONSIBILITIES.forEach(r=>{ remindedCount[n][r.id]=0; }); });
  last14.forEach(k=>{
    const d=state.days[k]; if(!d||!d.resp) return;
    kids.forEach(n=>{
      const kr=d.resp[n]; if(!kr) return;
      RESPONSIBILITIES.forEach(r=>{ if(kr[r.id]==="reminded") remindedCount[n][r.id]++; });
    });
  });

  const linesHtml=kids.map(n=>{
    let top=null;
    RESPONSIBILITIES.forEach(r=>{
      const c=remindedCount[n][r.id];
      if(c>0 && (!top || c>top.count)) top={label:r.label, count:c};
    });
    if(!top) return "";
    const verb = KID_FEM[n] ? "درّبيها" : "درّبيه";
    const suffix = KID_FEM[n] ? "لتستقلّ" : "ليستقلّ";
    return `<div class="pattern-line">${esc(n)} — ${esc(top.label)}: ${top.count} مرات بتذكير. ${verb} ٧ أيام ${suffix} بها.</div>`;
  }).join("");

  return `
    <div class="card">
      <h3>🪜 خطوتي التالية</h3>
      ${linesHtml || `<p class="muted">لا توجد مسؤولية تحتاج تدريباً إضافياً حالياً.</p>`}
    </div>
  `;
}

/* بطاقة «انسحابي» — تدخّلي مقابل استقلالهم آخر ١٤ يوماً */
function buildWithdrawalHtml(){
  const days14=lastNDays(14);
  const labels=days14.map(shortLabel);
  const interfered=days14.map(k=>{
    const d=state.days[k];
    return (d&&d.home&&typeof d.home.interfered==="number") ? d.home.interfered : 0;
  });
  const didItForSum = days14.reduce((sum,k)=>{
    const d=state.days[k];
    return sum + ((d&&d.home&&typeof d.home.didItFor==="number") ? d.home.didItFor : 0);
  }, 0);
  const cleanupSum = days14.reduce((sum,k)=>{
    const d=state.days[k];
    return sum + ((d&&d.home&&typeof d.home.myCleanup==="number") ? d.home.myCleanup : 0);
  }, 0);

  const stoppedEntries = Object.keys(state.days)
    .filter(k=>{ const d=state.days[k]; return d && d.home && (d.home.stoppedDoing||"").trim(); })
    .sort().reverse();
  const stoppedHtml = stoppedEntries.length
    ? stoppedEntries.map(k=>`<div class="stopped-row"><span class="stopped-date">${shortLabel(k)}</span> — ${esc(state.days[k].home.stoppedDoing)}</div>`).join("")
    : `<p class="muted">لم تُكتب ملاحظات بعد.</p>`;

  return `
    <div class="card">
      <h3>🕊️ انسحابي</h3>
