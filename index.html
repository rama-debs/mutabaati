      ${barChart(interfered, labels, "#7A4A63", "")}
      <div class="muted" style="margin-top:4px">الاتجاه النازل هو النجاح.</div>
      <div class="pattern-line" style="margin-top:12px">فعلتُها عنهم: ${didItForSum} مرة في ١٤ يوماً</div>
      <div class="pattern-line">أصلحتُ بعدهم: ${fmtDuration(cleanupSum)}</div>
      <div class="section-title">ما الذي كففتُ عن فعله عنهم</div>
      ${stoppedHtml}
    </div>
  `;
}
/* بطاقة «سلّم المهارات» — كل مهارة ودرجتها، وعدد الدرجات المكتسبة هذا الشهر */
function buildLadderStatsHtml(){
  const ladder=loadLadder();
  if(!ladder.length) return "";
  const sorted=ladder.slice().sort((a,b)=>b.level-a.level);
  const rowsHtml=sorted.map(s=>{
    const lastUpLabel = s.lastUp ? shortLabel(s.lastUp) : "—";
    return `<div class="ladder-stat-row">
      <span>${esc(s.name)} — ${esc(s.kid)}</span>
      <span class="muted">درجة ${s.level} · آخر صعود: ${lastUpLabel}</span>
    </div>`;
  }).join("");
  const thisMonth=todayKey();
  const upCount = ladder.reduce((sum,s)=>sum + s.history.filter(d=>isSameMonth(d, thisMonth)).length, 0);
  return `
    <div class="card">
      <h3>🧗 سلّم المهارات</h3>
      ${rowsHtml}
      <div class="pattern-line" style="margin-top:10px">صعدتِ ${upCount} ${upCount===1?"درجة":"درجات"} هذا الشهر</div>
    </div>
  `;
}

/* بطاقة «صلة الرحم» — سطر واحد لكل بند بعدد مرات الإنجاز آخر ٩٠ يوماً وتاريخ آخر مرة */
function buildKinStatsHtml(){
  const kin=loadKin();
  const cutoffKey=fmt(new Date(Date.now()-90*86400000));
  const todayKeyStr=todayKey();
  const rowsHtml=kin.map(item=>{
    const count=(item.history||[]).filter(d=>d>=cutoffKey).length;
    if(!count) return `<div class="kin-stat-row">${esc(item.title)} — لم تُنجَز في آخر ٩٠ يوماً.</div>`;
    const daysAgo=daysBetween(item.last, todayKeyStr);
    const lastText = daysAgo<=0 ? "اليوم" : `قبل ${daysAgo} يوماً`;
    return `<div class="kin-stat-row">${esc(item.title)} — ${count} مرات، آخرها ${lastText}.</div>`;
  }).join("");
  return `
    <div class="card">
      <h3>🤝 صلة الرحم</h3>
      ${rowsHtml || '<p class="muted">لا توجد بنود بعد.</p>'}
    </div>
  `;
}

function renderProgress(){
  // إخفاء الأرقام حتى إكمال ١٤ ليلة مسجّلة — يُرفع الحجاب تلقائياً عند اكتمالها
  if(state.settings.hideResults){
    const n=nightCount();
    if(n<14){
      view.innerHTML = `<div class="card night-veil">${daysWord(14-n)}. سجّلي ولا تحسبي.</div>`;
      return;
    }
    state.settings.hideResults=false;
    save();
    view.innerHTML = `<div class="card night-veil reveal">أكملتِ الأربعة عشر. انظري الآن.</div>`;
    return;
  }
  const days14=lastNDays(14);
  const labels=days14.map(shortLabel);
  const goalsPct=days14.map(k=>{const c=dayCompletion(k); return c.total?Math.round(c.done/c.total*100):0;});
  const protein=days14.map(k=>{const d=state.days[k]; return d?d.meals.reduce((s,m)=>s+(+m.p||0),0):0;});
  const calories=days14.map(k=>{const d=state.days[k]; return d?d.meals.reduce((s,m)=>s+(+m.c||0),0):0;});
  const water=days14.map(k=>{const d=state.days[k]; return d?(d.water||0):0;});
  const steps=days14.map(k=>{const d=state.days[k]; return d?(d.exercise&&d.exercise.steps||0):0;});
  const scolds=days14.map(k=>{const d=state.days[k]; return d?Object.values(d.kids||{}).filter(x=>x.scolded).length:0;});

  const streak=computeStreak();
  const avg=computeAvg14();
  const noScold=computeNoScoldStreak();
  const doneCount=loadItems().filter(it=>it.d).length;

  // بستاني: شبكة ٣٠ يوماً بلون يتدرّج حسب نسبة إنجاز اليوميات
  const garden30=lastNDays(30);
  let impactDays=0;
  const gardenCellsHtml = garden30.map(k=>{
    const c=dayCompletion(k);
    const p=c.total? c.done/c.total : 0;
    if(c.done>0) impactDays++;
    return `<div class="garden-cell" style="background:${gardenColor(p)}" title="${shortLabel(k)}"></div>`;
  }).join("");

  // جدول أولادي في ١٤ يوماً: ٥ دقائق، توبيخ، مهارات مسجّلة + نشاط جماعي وتهديدات البيت
  const weeksData = loadWeeks();
  const weekKeysInRange = new Set(days14.map(k=>weekStartKey(new Date(k+"T00:00:00"))));
  const kidsTableRows = KIDS.map(name=>{
    let specialCount=0, scoldCount=0;
    days14.forEach(k=>{
      const d=state.days[k];
      if(d && d.kids && d.kids[name]){
        if(d.kids[name].special) specialCount++;
        if(d.kids[name].scolded) scoldCount++;
      }
    });
    let skillCount=0;
    weekKeysInRange.forEach(wk=>{
      const kd=weeksData[wk] && weeksData[wk][name];
      if(kd && kd.skill && kd.skill.trim()) skillCount++;
    });
    return `<tr><td>${esc(name)}</td><td>${specialCount}</td><td>${scoldCount}</td><td>${skillCount}</td></tr>`;
  }).join("");
  let homeGroupCount=0, homeThreatCount=0, homeKeptCount=0;
  days14.forEach(k=>{
    const d=state.days[k];
    if(d && d.home){
      if(d.home.group) homeGroupCount++;
      if(d.home.threat){ homeThreatCount++; if(d.home.kept===true) homeKeptCount++; }
    }
  });
  const kidsTableHtml = `
    <div class="card">
      <h3>🧒 أولادي في ١٤ يوماً</h3>
      <table class="kids-table">
        <thead><tr><th>الطفل</th><th>٥ دقائق</th><th>توبيخ</th><th>مهارات</th></tr></thead>
        <tbody>${kidsTableRows}</tbody>
      </table>
      <div class="section-title" style="margin-top:14px">نشاط جماعي: ${homeGroupCount} أيام من ${days14.length}</div>
      <div class="muted">التهديدات: ${homeThreatCount} — نُفِّذ منها ${homeKeptCount}</div>
    </div>
  `;

  // رسوم لكل طفل: الوقت الخاص والتوبيخ
  const kidCharts = KIDS.map(name=>{
    const special=days14.map(k=>{const d=state.days[k]; return d&&d.kids[name]&&d.kids[name].special?1:0;});
    const sc=days14.map(k=>{const d=state.days[k]; return d&&d.kids[name]&&d.kids[name].scolded?1:0;});
    return `<div class="card">
      <h3>🧒 ${esc(name)}</h3>
      <div class="section-title" style="margin-top:0">الوقت الخاص (١٤ يوماً)</div>
      ${barChart(special,labels,"#3A6B86","")}
      <div class="section-title">التوبيخ (١٤ يوماً)</div>
      ${barChart(sc,labels,"#7A4A63","")}
    </div>`;
  }).join("");

  // آخر ٢٠ مهمة أو هدف مشطوب
  const doneAll = loadItems().filter(it=>it.d).sort((a,b)=>(b.dt||"").localeCompare(a.dt||"")).slice(0,20);
  const doneAllHtml = doneAll.length ? doneAll.map(it=>`
    <div class="kg-item done">
      <div class="kg-chk">✓</div>
      <div class="kg-text">${esc(it.x)}${it.o!=="me"?` <span class="muted">· ${esc(it.o)}</span>`:""}</div>
    </div>`).join("") : `<p class="muted">لا توجد مهامّ أو أهداف منجَزة بعد.</p>`;

  // سجلّ مواقف التوبيخ لآخر ٣٠ يوماً، مجمّعة حسب المحفّز لا حسب التاريخ
  const days30=lastNDays(30);
  const NO_TRIGGER_LABEL="بلا محفّز محدَّد";
  const incidentsByTrigger={};
  days30.forEach(k=>{
    const d=state.days[k]; if(!d||!d.kids) return;
    KIDS.forEach(name=>{
      const kd=d.kids[name]; if(!kd||!kd.scolded) return;
      const triggers=(kd.scoldTrigger&&kd.scoldTrigger.length)?kd.scoldTrigger:[NO_TRIGGER_LABEL];
      triggers.forEach(t=>{
        incidentsByTrigger[t]=incidentsByTrigger[t]||[];
        incidentsByTrigger[t].push({date:k, name, what:kd.what, next:kd.next});
      });
    });
  });
  const triggerKeys=Object.keys(incidentsByTrigger).sort((a,b)=>{
    if(a===NO_TRIGGER_LABEL) return 1;
    if(b===NO_TRIGGER_LABEL) return -1;
    return incidentsByTrigger[b].length - incidentsByTrigger[a].length;
  });
  const logHtml = triggerKeys.length ? triggerKeys.map(t=>{
    const items=incidentsByTrigger[t].slice().sort((a,b)=>b.date.localeCompare(a.date));
    const itemsHtml=items.map(it=>`
      <div class="log-item">
        <div class="log-date">${shortLabel(it.date)} · ${esc(it.name)}</div>
        <div class="log-line">${it.what?esc(it.what):"—"}</div>
        ${it.next?`<div class="log-note">🔁 ${esc(it.next)}</div>`:""}
      </div>`).join("");
    return `<div class="section-title" style="margin-top:14px">${esc(t)} (${items.length})</div>${itemsHtml}`;
  }).join("") : `<p class="muted">لا توجد مواقف توبيخ مسجّلة بعد.</p>`;

  // مواقف «صدر منّي تصرّف أضعف موقفي» ضمن آخر ٣٠ يوماً — مجمّعة معاً مع خطوة الإصلاح
  const authorityIncidents=[];
  days30.forEach(k=>{
    const d=state.days[k]; if(!d||!d.home||!d.home.authority) return;
    const auth=d.home.authority; if(!auth.happened) return;
    authorityIncidents.push({date:k, kinds:auth.kinds, who:auth.who, what:auth.what, repair:auth.repair});
  });
  authorityIncidents.sort((a,b)=>b.date.localeCompare(a.date));
  const authorityLogHtml = authorityIncidents.length ? `
    <div class="section-title" style="margin-top:14px">صدر منّي تصرّف أضعف موقفي (${authorityIncidents.length})</div>
    ${authorityIncidents.map(it=>`
      <div class="log-item">
        <div class="log-date">${shortLabel(it.date)}${it.who&&it.who.length?` · ${it.who.map(w=>esc(w)).join("، ")}`:""}</div>
        <div class="log-line">${it.what?esc(it.what):(it.kinds&&it.kinds.length?it.kinds.map(kk=>esc(kk)).join("، "):"—")}</div>
        ${it.repair?`<div class="log-note" style="color:var(--moss)">🔧 ${esc(it.repair)}</div>`:""}
      </div>`).join("")}
  ` : "";

  view.innerHTML = `
    <div class="stats-row">
      <div class="stat"><div class="num" style="color:var(--moss)">${streak}</div><div class="lbl">أيام متتالية</div></div>
      <div class="stat"><div class="num" style="color:var(--amber)">${avg}%</div><div class="lbl">إنجاز اليوميات (١٤ يوماً)</div></div>
      <div class="stat"><div class="num" style="color:var(--plum)">${doneCount}</div><div class="lbl">مهامّ منجَزة</div></div>
      <div class="stat"><div class="num" style="color:var(--sky)">${noScold}</div><div class="lbl">أيام بلا توبيخ</div></div>
    </div>
    <div class="card">
      <h3>🌱 بستاني</h3>
      <div class="garden-grid">${gardenCellsHtml}</div>
      <div class="garden-caption">${impactDays} يوماً من ${garden30.length} فيها أثر</div>
    </div>
    ${buildPatternsHtml()}
    ${buildPrayerStatsHtml()}
    ${buildKidsGrowthHtml()}
    ${buildKidsNextStepHtml()}
    ${buildTouchStatsHtml()}
    ${buildWithdrawalHtml()}
    ${buildLadderStatsHtml()}
    ${buildTomorrowStatsHtml()}
    ${buildSkinStatsHtml()}
    ${buildKinStatsHtml()}
    <div class="card">
      <h3>📊 آخر ١٤ يوماً</h3>
      <div class="section-title" style="margin-top:0">نسبة إنجاز الأهداف</div>
      ${barChart(goalsPct,labels,"#4C6B52","%")}
      <div class="section-title">البروتين (غرام)</div>
      ${barChart(protein,labels,"#B8862F","غ")}
      <div class="section-title">السعرات</div>
      ${barChart(calories,labels,"#3A6B86","سعرة")}
      <div class="section-title">الماء (أكواب)</div>
      ${barChart(water,labels,"#3A6B86","")}
      <div class="section-title">الخطوات</div>
      ${barChart(steps,labels,"#6E7080","")}
      <div class="section-title">التوبيخ</div>
      ${barChart(scolds,labels,"#7A4A63","")}
    </div>
    ${kidsTableHtml}
    ${kidCharts}
    <div class="card">
      <h3>🌟 ما أنجزتُه</h3>
      <div class="kg-list">${doneAllHtml}</div>
    </div>
    <div class="card">
      <h3>📋 سجلّ المواقف (آخر ٣٠ يوماً)</h3>
      ${logHtml}
      ${authorityLogHtml}
    </div>
  `;
}

/* قائمة الأهداف الموحّدة مقسّمة على الفئات — تُستعمل في «أهدافي» وفي شاشة «أسبوعي» معاً */
function buildActiveGoalsListHtml(){
  const totalGoals=state.goals.length;
  const activeCount=state.goals.filter(g=>g.active).length;
  let html="";
  CAT_ORDER.forEach(cat=>{
    const items=state.goals.filter(g=>g.category===cat);
    if(!items.length) return;
    html+=`<div class="section-title">${esc(cat)}</div>`;
    html+=items.map(g=>{
      const daysRow = g.active ? `<div class="days">${ALL_DAYS.map(di=>
        `<button class="day ${g.days.includes(di)?"on":""}" data-action="goalDay" data-id="${g.id}" data-day="${di}">${DAY_SHORT[di]}</button>`
      ).join("")}</div>` : "";
      return `<div class="goal-row">
        <div class="goal-row-top">
          <span class="goal-name ${g.active?"on":""}">${esc(g.name)}</span>
          <button class="toggle ${g.active?"on":""}" data-action="goalToggle" data-id="${g.id}" role="switch" aria-checked="${g.active}"><span class="knob"></span></button>
        </div>
        ${daysRow}
      </div>`;
    }).join("");
  });
  return {activeCount, totalGoals, html};
}

/* صفحة «أهدافي اليومية» — مقسّمة على الأصعدة الفعلية المستعملة في شاشة اليوم */
function buildDailyGoalsPageHtml(){
  const spheresHtml = SPHERES.map(s=>{
    const goals = state.goals.filter(g=>s.categories.includes(g.category));
    const activeInSphere = goals.filter(g=>g.active).length;
    const isOpen = !!openGoalSphere[s.key];
    const rowsHtml = goals.map(g=>{
      const daysRow = g.active ? `<div class="days">${ALL_DAYS.map(di=>
        `<button class="day ${g.days.includes(di)?"on":""}" data-action="goalDay" data-id="${g.id}" data-day="${di}">${DAY_SHORT[di]}</button>`
      ).join("")}</div>` : "";
      return `<div class="goal-row">
        <div class="goal-row-top">
          <span class="goal-name ${g.active?"on":""}">${esc(g.name)}</span>
          <button class="toggle ${g.active?"on":""}" data-action="goalToggle" data-id="${g.id}" role="switch" aria-checked="${g.active}"><span class="knob"></span></button>
        </div>
        ${daysRow}
      </div>`;
    }).join("");
    return `<div class="card">
      <div class="goal-sphere-head" data-action="goalSphereToggle" data-sphere="${s.key}">
        <span>${esc(s.name)}</span>
        <span class="muted">${activeInSphere} من ${goals.length} شغّالة</span>
        <span class="kid-detail-arrow">${isOpen?"▲":"▼"}</span>
      </div>
      ${isOpen?rowsHtml:""}
    </div>`;
  }).join("");

  return `
    <div class="card">
      <div class="row">
        <button class="btn ghost small" data-action="goalsDisableAll">أطفئي الكل</button>
        <button class="btn ghost small" data-action="goalsResetDefault">أعيدي الافتراضي</button>
      </div>
    </div>
    ${spheresHtml}
    <div class="card">
      <h3 style="margin-top:0">➕ إضافة هدف مخصّص</h3>
      <label class="fld" style="margin-top:0">اسم الهدف</label>
      <input type="text" id="customName" placeholder="اكتبي اسم الهدف">
      <label class="fld">الفئة</label>
      <select id="customCat">${CAT_ORDER.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
      <div style="margin-top:12px"><button class="btn" data-action="addCustom">أضيفي الهدف</button></div>
    </div>
  `;
}

    <div class="kg-item" data-action="kgDone" data-id="${it.id}">
      <div class="kg-chk"></div>

      ${deleteButtonHtml("kgDel", it.id)}
    </div>`).join("") : `<div class="kg-empty">لا توجد مهامّ معلّقة.</div>`;
  const myDoneHtml = myDone.length ? myDone.map(it=>`
    <div class="kg-item done">
      <div class="kg-chk">✓</div>
      <div class="kg-text">${esc(it.x)}</div>
      ${deleteButtonHtml("kgDel", it.id)}
    </div>`).join("") : `<div class="kg-empty">لا توجد مهامّ منجَزة بعد.</div>`;
  return `
    <div class="card">
      <div class="row" data-me-row="1">

}

function renderGoals(){

  if(!goalsPage){ view.innerHTML = buildGoalsMenuHtml(); return; }

/* ============ معالجة الأحداث ============ */
view.addEventListener("click", e=>{
  const el=e.target.closest("[data-action]");
  if(!el) return;
  const a=el.dataset.action;
  const key=todayKey();

  if(a==="toggleGoal"){
    const day=getDay(key); const id=el.dataset.id;
    const cur=day.done[id];
    if(!cur) day.done[id]="yes";
    else if(cur==="yes") day.done[id]="no";
    else { delete day.done[id]; day.reasons[id]=[]; day.detail[id]=""; }
    save(); renderCurrent();
  }
  else if(a==="goalReasonToggle"){
    const day=getDay(key); const id=el.dataset.id; const r=el.dataset.reason;
    day.reasons[id]=day.reasons[id]||[];
    if(day.reasons[id].includes(r)) day.reasons[id]=day.reasons[id].filter(x=>x!==r);
    else day.reasons[id].push(r);
    save(); renderCurrent();
  }
  else if(a==="sphereToggle"){
    const k=el.dataset.sphere;
    openSphere = openSphere===k ? null : k;
    renderCurrent();
  }
  else if(a==="goalsPageOpen"){ goalsPage=el.dataset.page; renderCurrent(); }
  else if(a==="goalsPageClose"){ goalsPage=null; renderCurrent(); }
  else if(a==="goalSphereToggle"){
    const k=el.dataset.sphere;
    openGoalSphere[k]=!openGoalSphere[k];
    renderCurrent();
  }
  else if(a==="goalsDisableAll"){
    if(!confirm("سيُطفأ كل الأهداف الشغّالة الآن. متابعة؟")) return;
    state.goals.forEach(g=>{ g.active=false; });
    save(); renderCurrent();
  }
  else if(a==="goalsResetDefault"){
    if(!confirm("ستُعاد كل الأهداف إلى حالتها الافتراضية (الأصلية شغّالة بأيامها المعتادة، والبقية مطفأة). متابعة؟")) return;
    const defaultNames=new Set(DEFAULT_GOALS.map(g=>g[0]));
    state.goals.forEach(g=>{
      const bankEntry=BANK.find(b=>b.name===g.name);
      g.active=defaultNames.has(g.name);
      if(bankEntry) g.days=bankEntry.days.slice();
    });
    save(); renderCurrent();
  }
  else if(a==="prayerToggleExpand"){ prayerExpanded=!prayerExpanded; renderCurrent(); }
  else if(a==="prayerStatusCycle"){
    const day=getDay(key); const pk=el.dataset.key;
    const cur=day.prayerStatus[pk];
    if(!cur) day.prayerStatus[pk]="ontime";
    else if(cur==="ontime") day.prayerStatus[pk]="late";
    else if(cur==="late") day.prayerStatus[pk]="missed";
    else day.prayerStatus[pk]=null;
    save(); renderCurrent();
  }
  else if(a==="kinDone"){
    const list=loadKin();
    const item=list.find(x=>x.id===el.dataset.id);
    if(item){
      item.last=todayKey();
      item.history=item.history||[];
      item.history.push(todayKey());
      saveKin(list); renderCurrent();
    }
  }
  else if(a==="kinKidSend"){
    const list=loadKin();
    const item=list.find(x=>x.id===el.dataset.id);
    if(item){
      const thisWeek=weekStartKey(new Date());
      const alreadyThisWeek = item.last && item.last>=thisWeek;
      item.kids=item.kids||{};
      item.kids[el.dataset.kid]=thisWeek;
      item.last=todayKey();
      item.history=item.history||[];
      if(!alreadyThisWeek) item.history.push(todayKey());
      saveKin(list); renderCurrent();
    }
  }
  else if(a==="kinAddSara"){
    const list=loadKin();
    const item=list.find(x=>x.id===el.dataset.id);
    if(item){
      item.extraKids=item.extraKids||[];
      if(!item.extraKids.includes("سارة")) item.extraKids.push("سارة");
      saveKin(list); renderCurrent();
    }
  }
  else if(a==="kinAddStart"){ kinDraft={id:null, title:"", cycle:"weekly", day:0}; renderCurrent(); }
  else if(a==="kinEditStart"){
    const item=loadKin().find(x=>x.id===el.dataset.id);
    if(item) kinDraft={id:item.id, title:item.title, cycle:item.cycle, day:item.day!=null?item.day:0};
    renderCurrent();
  }
  else if(a==="kinDraftCancel"){ kinDraft=null; renderCurrent(); }
  else if(a==="kinDraftSave"){
    if(!kinDraft) return;
    const title=(kinDraft.title||"").trim();
    if(!title){ alert("اكتبي اسم البند أولاً."); return; }
    const list=loadKin();
    if(kinDraft.id){
      const item=list.find(x=>x.id===kinDraft.id);
      if(item){
        item.title=title; item.cycle=kinDraft.cycle;
        if(kinDraft.cycle==="weekly") item.day=+kinDraft.day; else delete item.day;
      }
    }else{
      const newItem={id:genId(), title, cycle:kinDraft.cycle, last:null, history:[]};
      if(kinDraft.cycle==="weekly") newItem.day=+kinDraft.day;
      list.push(newItem);
    }
    saveKin(list); kinDraft=null; renderCurrent();
  }
  else if(a==="kinDelete"){
    if(!requestDeleteConfirm(el.dataset.id)) return;
    deleteConfirmId=null; clearTimeout(deleteConfirmTimer);
    saveKin(loadKin().filter(x=>String(x.id)!==String(el.dataset.id)));
    renderCurrent();
  }
  else if(a==="toggleTasksPanel"){ showTasksPanel=!showTasksPanel; renderCurrent(); }
  else if(a==="toggleJournalPanel"){ showJournalPanel=!showJournalPanel; renderCurrent(); }
  else if(a==="delMeal"){
    const day=getDay(key); day.meals=day.meals.filter(m=>m.id!==el.dataset.id); save(); renderCurrent();
  }
  else if(a==="addMeal"){
    const nameEl=document.getElementById("mealName"), gEl=document.getElementById("mealGrams"), cEl=document.getElementById("mealCalories");
    const name=(nameEl.value||"").trim(); const p=+gEl.value; const c=+cEl.value||0;
    if(!name||!p){ setStatus("protStatus","اكتبي اسم الوجبة والبروتين.","err"); return; }
    const day=getDay(key); day.meals.push({id:genId(), name, p, c});
    const mine=loadMyFoods();
    const existingIdx=mine.findIndex(it=>it[0]===name);
    if(existingIdx>=0) mine[existingIdx]=[name,p,c];
    else mine.push([name,p,c]);
    saveMyFoods(mine);
    save(); renderCurrent();
  }
  else if(a==="foodPick"){
    const item=foodPickList[+el.dataset.idx]; if(!item) return;
    const day=getDay(key); day.meals.push({id:genId(), name:item[0], p:item[1], c:item[2]||0});
    save(); renderCurrent();
  }
  else if(a==="quickAdd"){
    const inp=document.getElementById("quickAddInput");
    const text=(inp.value||"").trim();
    const r=parseQuickEntry(text);
    if(!r){ setStatus("protStatus","اكتبي الكمية والمكوّن، مثل: ٢ بيضة أو كوب أرز.","err"); return; }
    if(r.error==="notfound"){ setStatus("protStatus",`لم أجد "${esc(r.term)}" في قاعدة المكوّنات. جرّبي المكتبة أو الإدخال اليدوي.`,"err"); return; }
    if(r.error==="unit"){ setStatus("protStatus","لم أفهم الوحدة المستعملة.","err"); return; }
    const day=getDay(key); day.meals.push({id:genId(), name:r.name, p:r.p, c:r.c});
    save(); renderCurrent();
    setStatus("protStatus", `أُضيف: ${esc(r.name)} (${r.grams} غ) — ${r.p} غ بروتين · ${r.c} سعرة ✓`, "ok");
  }
  else if(a==="waterInc"){ const day=getDay(key); day.water++; save(); renderCurrent(); }
  else if(a==="waterDec"){ const day=getDay(key); day.water=Math.max(0,day.water-1); save(); renderCurrent(); }
  else if(a==="exToggle"){ const day=getDay(key); day.exercise.done=!day.exercise.done; save(); renderCurrent(); }
  else if(a==="bodySubTab"){ bodySubTab=el.dataset.sub; renderCurrent(); }
  else if(a==="skinStepToggle"){
    const day=getDay(key); const group=el.dataset.group;
    if(group==="body") day.skin.body=!day.skin.body;
    else day.skin[group][el.dataset.step]=!day.skin[group][el.dataset.step];
    save(); renderCurrent();
  }
  else if(a==="skinEyePatchToggle"){
    const day=getDay(key); day.skin.eyePatch=!day.skin.eyePatch;
    save(); renderCurrent();
  }
  else if(a==="skinIrritationAnswer"){
    const s=skinSettings();
    s.weeklyIrritation[el.dataset.week]=el.dataset.val==="true";
    saveSkinSettings(s); renderCurrent();
  }
  else if(a==="skinIncreaseNights"){
    const s=skinSettings();
    if(!s.retinalDays.includes(3)) s.retinalDays.push(3); // الأربعاء — الثلاثاء محجوز لليزر
    s.nightsPerWeek=s.retinalDays.length;
    s.lastIncrease=todayKey();
    saveSkinSettings(s); renderCurrent();
  }
  else if(a==="skinDecreaseNights"){
    const s=skinSettings();
    if(s.retinalDays.length>1) s.retinalDays.pop();
    s.nightsPerWeek=s.retinalDays.length;
    saveSkinSettings(s); renderCurrent();
  }
  else if(a==="skinPhotoTrigger"){
    const inp=document.getElementById("skinPhotoInput"); if(inp) inp.click();
  }
  else if(a==="skinRetinalDayToggle"){
    const s=skinSettings(); const d=+el.dataset.day;
    if(s.retinalDays.includes(d)) s.retinalDays=s.retinalDays.filter(x=>x!==d);
    else s.retinalDays.push(d);
    s.nightsPerWeek=s.retinalDays.length;
    saveSkinSettings(s); renderCurrent();
  }
  else if(a==="recipeNew"){
    recipeDraft={id:null, name:"", link:"", image:null, servings:4,
      ingredients:[{qty:"",unit:"غرام",name:""}], method:"", note:"", liked:false};
    addIngTargetIdx=null; addIngDraft=null;
    renderCurrent();
  }
  else if(a==="recipeAddToday"){
    const r=loadRecipes().find(x=>x.id===el.dataset.id); if(!r) return;
    const m=recipeMacros(r);
    const day=getDay(key);
    day.meals.push({id:genId(), name:r.name, p:m.p, c:m.c});
    save();
    bodySubTab="daily";
    renderCurrent();
  }
  else if(a==="recipeEdit"){
    const r=loadRecipes().find(x=>x.id===el.dataset.id); if(!r) return;
    recipeDraft=JSON.parse(JSON.stringify(r));
    if(!recipeDraft.ingredients.length) recipeDraft.ingredients=[{qty:"",unit:"غرام",name:""}];
    addIngTargetIdx=null; addIngDraft=null;
    renderCurrent();
  }
  else if(a==="recipeCancel"){ recipeDraft=null; addIngTargetIdx=null; addIngDraft=null; renderCurrent(); }
  else if(a==="recipeIngAdd"){
    if(!recipeDraft) return;
    recipeDraft.ingredients.push({qty:"",unit:"غرام",name:""});
    renderCurrent();
  }
  else if(a==="recipeIngDel"){
    if(!recipeDraft) return;
    recipeDraft.ingredients.splice(+el.dataset.idx,1);
    renderCurrent();
  }
  else if(a==="recipeSave"){
    if(!recipeDraft) return;
    const name=(recipeDraft.name||"").trim();
    if(!name){ alert("اكتبي اسم الوصفة قبل الحفظ."); return; }
    const list=loadRecipes();
    const clean={
      id: recipeDraft.id || genId(),
      name,
      link:(recipeDraft.link||"").trim(),
      image: recipeDraft.image||null,
      servings: +recipeDraft.servings||4,
      ingredients: recipeDraft.ingredients.filter(r=>(r.name||"").trim()).map(r=>({qty:r.qty, unit:r.unit, name:r.name})),
      method: recipeDraft.method||"",
      note: recipeDraft.note||"",
      liked: !!recipeDraft.liked,
      createdAt: recipeDraft.createdAt || Date.now()
    };
    const idx=list.findIndex(x=>x.id===clean.id);
    if(idx>=0) list[idx]=clean; else list.push(clean);
    if(saveRecipes(list)){ recipeDraft=null; addIngTargetIdx=null; addIngDraft=null; }
    renderCurrent();
  }
  else if(a==="recipeDelete"){
    const list=loadRecipes().filter(x=>x.id!==el.dataset.id);
    saveRecipes(list); renderCurrent();
  }
  else if(a==="ingAddNew"){
    if(!recipeDraft) return;
    const row=recipeDraft.ingredients[+el.dataset.idx]; if(!row) return;
    addIngTargetIdx=+el.dataset.idx;
    addIngDraft={name:(row.name||"").trim(), c:"", p:"", fiber:"", iron:"", calcium:"", vitc:"", serv:""};
    renderCurrent();
  }
  else if(a==="ingAddCancel"){ addIngTargetIdx=null; addIngDraft=null; renderCurrent(); }
  else if(a==="ingAddSave"){
    if(!addIngDraft) return;
    const name=(addIngDraft.name||"").trim();
    if(!name){ alert("اكتبي اسم المكوّن."); return; }
    const row=[name, +addIngDraft.c||0, +addIngDraft.p||0, +addIngDraft.fiber||0,
      +addIngDraft.iron||0, +addIngDraft.calcium||0, +addIngDraft.vitc||0, +addIngDraft.serv||100];
    const list=loadMyIngs();
    const idx=list.findIndex(r=>r[0]===name);
    if(idx>=0) list[idx]=row; else list.push(row);
    saveMyIngs(list);
    addIngTargetIdx=null; addIngDraft=null;
    renderCurrent();
  }
  else if(a==="importIngredients"){
    if(!recipeDraft) return;
    const ta=document.getElementById("importText");
    const lines=(ta.value||"").split("\n");
    let ok=0, failed=0;
    const newRows=[];
    lines.forEach(line=>{
      if(!line.trim()) return;
      const parsed=parseImportLine(line);
      if(parsed){ newRows.push(parsed); ok++; } else failed++;
    });
    if(!newRows.length){
      setStatus("importStatus", failed?`لم أفهم أي سطر (${failed}).`:"الصقي قائمة المقادير أولاً.", "err");
      return;
    }
    const isBlankOnly = recipeDraft.ingredients.length===1 && !recipeDraft.ingredients[0].name && !recipeDraft.ingredients[0].qty;
    recipeDraft.ingredients = isBlankOnly ? newRows : recipeDraft.ingredients.concat(newRows);
    ta.value="";
    renderCurrent();
    setStatus("importStatus", failed?`تم استيراد ${ok} مقداراً، وتعذّر فهم ${failed} سطراً.`:`تم استيراد ${ok} مقداراً بنجاح ✓`, failed?"err":"ok");
  }
  else if(a==="kidToggle"){
    const day=getDay(key); const k=day.kids[el.dataset.kid];
    k[el.dataset.field]=!k[el.dataset.field]; save(); renderCurrent();
  }
  else if(a==="kidMultiToggle"){
    const day=getDay(key); const k=day.kids[el.dataset.kid];
    const field=el.dataset.field, val=el.dataset.val;
    k[field]=k[field]||[];
    if(k[field].includes(val)) k[field]=k[field].filter(x=>x!==val);
    else k[field].push(val);
    save(); renderCurrent();
  }
  else if(a==="homeToggle"){
    const day=getDay(key);
    day.home[el.dataset.field]=!day.home[el.dataset.field]; save(); renderCurrent();
  }
  else if(a==="homeKept"){
    const day=getDay(key);
    day.home.kept = el.dataset.val==="true"; save(); renderCurrent();
  }
  else if(a==="homeAuthorityToggle"){
    const day=getDay(key);
    day.home.authority.happened=!day.home.authority.happened;
    save(); renderCurrent();
  }
  else if(a==="respCycle"){
    const day=getDay(key);
    const kid=el.dataset.kid, rid=el.dataset.resp;
    day.resp[kid]=day.resp[kid]||{};
    const order=["alone","reminded","not"];
    const cur=day.resp[kid][rid];
    const idx=order.indexOf(cur);
    if(idx===-1) day.resp[kid][rid]="alone";
    else if(idx<order.length-1) day.resp[kid][rid]=order[idx+1];
    else delete day.resp[kid][rid];
    save(); renderCurrent();
  }
  else if(a==="respAddSara"){
    const list=respKidsList();
    if(!list.includes("سارة")) list.push("سارة");
    save(); renderCurrent();
  }
  else if(a==="respRowAll"){
    const day=getDay(key); const kid=el.dataset.kid;
    day.resp[kid]=day.resp[kid]||{};
    RESPONSIBILITIES.forEach(r=>{ day.resp[kid][r.id]="alone"; });
    save(); renderCurrent();
  }
  else if(a==="touchToggle"){
    const day=getDay(key); const kid=el.dataset.kid, m=el.dataset.moment;
    day.kids[kid].touch[m]=!day.kids[kid].touch[m];
    save(); renderCurrent();
  }
  else if(a==="touchColumnFill"){
    const day=getDay(key); const m=el.dataset.moment;
    const school=goesToSchoolSettings();
    const momentDef=TOUCH_MOMENTS.find(x=>x.id===m);
    KIDS.forEach(name=>{
      if(momentDef.schoolOnly && !school[name]) return;
      day.kids[name].touch[m]=true;
    });
    save(); renderCurrent();
  }
  else if(a==="goesToSchoolToggle"){
    const school=goesToSchoolSettings();
    school[el.dataset.kid]=!school[el.dataset.kid];
    save(); renderCurrent();
  }
  else if(a==="respCopyYesterday"){
    const day=getDay(key);
    if(respRecordedToday(day) && !confirm("سيُستبدَل ما سجّلتِه اليوم بجدول الأمس. متابعة؟")) return;
    const yesterday=new Date(key+"T00:00:00"); yesterday.setDate(yesterday.getDate()-1);
    const yDay=state.days[fmt(yesterday)];
    day.resp = (yDay && yDay.resp) ? JSON.parse(JSON.stringify(yDay.resp)) : {};
    save(); renderCurrent();
  }
  else if(a==="respClearToday"){
    const day=getDay(key);
    if(!respRecordedToday(day)) return;
    if(!confirm("سيُفرَغ جدول اليوم بالكامل. متابعة؟")) return;
    day.resp={};
    save(); renderCurrent();
  }
  else if(a==="toggleKidDetail"){
    openKidDetail[el.dataset.kid]=!openKidDetail[el.dataset.kid];
    renderCurrent();
  }
  else if(a==="exportKidsCSV"){ exportKidsRespCSV(); }
  else if(a==="ladderUp"){
    const list=loadLadder(); const s=list.find(x=>x.id===el.dataset.id); if(!s) return;
    if(s.level<5){
      if(ladderDaysOnLevel(s)<3) alert("٣ أيام ناجحة على الأقل قبل الصعود");
      s.level++;
      const t=todayKey();
      s.lastUp=t;
      s.history.push(t);
    }
    saveLadder(list); renderCurrent();
  }
  else if(a==="ladderDown"){
    const list=loadLadder(); const s=list.find(x=>x.id===el.dataset.id); if(!s) return;
    if(s.level>1) s.level--;
    saveLadder(list); renderCurrent();
  }
  else if(a==="ladderAddStart"){ ladderDraft={name:"", kid:KIDS[0], level:1}; renderCurrent(); }
  else if(a==="ladderDraftCancel"){ ladderDraft=null; renderCurrent(); }
  else if(a==="ladderDraftSave"){
    if(!ladderDraft) return;
    const name=(ladderDraft.name||"").trim();
    if(!name){ alert("اكتبي اسم المهارة أولاً."); return; }
    const list=loadLadder();
    list.push({id:genId(), name, kid:ladderDraft.kid, level:+ladderDraft.level, lastUp:null, createdAt:todayKey(), history:[]});
    saveLadder(list);
    ladderDraft=null;
    renderCurrent();
  }
  else if(a==="homeCounter"){
    const day=getDay(key);
    const field=el.dataset.field, v=+el.dataset.val;
    day.home[field] = day.home[field]===v ? null : v;
    save(); renderCurrent();
  }
  else if(a==="tomorrowTogglePicker"){ tomorrowPickerOpen=!tomorrowPickerOpen; renderCurrent(); }
  else if(a==="tomorrowPickItem"){
    const store=loadTomorrow();
    const items=ensureTomorrowSlot(store, tomorrowKey());
    const emptyIdx=items.findIndex(x=>!x.t.trim());
    if(emptyIdx===-1) return; // لا خانة فارغة لاستقبال المهمّة
    items[emptyIdx]={t:el.dataset.text, done:false, moved:0};
    saveTomorrow(store);
    tomorrowPickerOpen=false;
    renderCurrent();
  }
  else if(a==="tomorrowToggleDone"){
    const store=loadTomorrow();
    const items=store[todayKey()]; if(!items) return;
    const idx=+el.dataset.idx;
    items[idx].done=!items[idx].done;
    saveTomorrow(store); renderCurrent();
  }
  else if(a==="tomorrowMove"){
    const store=loadTomorrow();
    const todayItems=store[todayKey()]; if(!todayItems) return;
    const idx=+el.dataset.idx;
    const item=todayItems[idx]; if(!item||!item.t.trim()) return;
    const tomorrowItems=ensureTomorrowSlot(store, tomorrowKey());
    const emptyIdx=tomorrowItems.findIndex(x=>!x.t.trim());
    if(emptyIdx===-1) return; // قائمة الغد ممتلئة بالفعل
    tomorrowItems[emptyIdx]={t:item.t, done:false, moved:item.moved+1};
    todayItems[idx]={t:"", done:false, moved:0};
    saveTomorrow(store); renderCurrent();
  }
  else if(a==="tomorrowStrike"){
    const store=loadTomorrow();
    const todayItems=store[todayKey()]; if(!todayItems) return;
    const idx=+el.dataset.idx;
    todayItems[idx]={t:"", done:false, moved:0};
    saveTomorrow(store); renderCurrent();
  }
  else if(a==="catchDone"){
    const list=loadCatch(); const c=list.find(x=>x.id===el.dataset.id); if(!c) return;
    c.done=true; c.archived=true;
    saveCatch(list); renderCurrent();
  }
  else if(a==="catchDefer"){
    const list=loadCatch(); const c=list.find(x=>x.id===el.dataset.id); if(!c) return;
    c.when=catchNextWhen(c.when); c.moved=(c.moved||0)+1;
    saveCatch(list); renderCurrent();
  }
  else if(a==="catchDismiss"){
    const list=loadCatch(); const c=list.find(x=>x.id===el.dataset.id); if(!c) return;
    c.archived=true;
    saveCatch(list); renderCurrent();
  }
  else if(a==="catchArchiveToggle"){ catchArchiveOpen=!catchArchiveOpen; renderCurrent(); }
  else if(a==="catchArchiveClear"){
    if(!confirm("سيُحذف كل الملاحظات المؤرشفة نهائياً. متابعة؟")) return;
    saveCatch(loadCatch().filter(c=>!c.archived));
    renderCurrent();
  }
  else if(a==="nightClose"){
    getDay(key).night=true; save();
    nightFarewell=true; renderCurrent();
    setTimeout(()=>{ nightFarewell=false; currentTab="today"; renderCurrent(); }, 2000);
  }
  else if(a==="hideResultsToggle"){
    state.settings.hideResults=!state.settings.hideResults;
    save(); renderCurrent();
  }
  else if(a==="openWeekly"){
    showWeekly=true; weeklyExportResult=null; currentTab="goals"; renderCurrent();
  }
  else if(a==="closeWeekly"){
    showWeekly=false; weeklyExportResult=null; renderCurrent();
  }
  else if(a==="weeklyPrayerToggle"){
    const w=weeklySettings(); w.prayerExport=!w.prayerExport; save(); renderCurrent();
  }
  else if(a==="weeklyExport"){
    const result=buildWeeklyRitualICS();
    downloadICS(result.ics, "mutabaati-weekly.ics");
    const w=weeklySettings();
    w.lastExport=todayKey();
    weeklyExportResult=result;
    save(); renderCurrent();
  }
  else if(a==="homeCleanup"){
    const day=getDay(key);
    const v=+el.dataset.val;
    day.home.myCleanup = day.home.myCleanup===v ? null : v;
    save(); renderCurrent();
  }
  else if(a==="authorityMulti"){
    const day=getDay(key); const auth=day.home.authority;
    const field=el.dataset.field, val=el.dataset.val;
    auth[field]=auth[field]||[];
    if(auth[field].includes(val)) auth[field]=auth[field].filter(x=>x!==val);
    else auth[field].push(val);
    save(); renderCurrent();
  }
  else if(a==="openWeekReview"){ showWeekReview=true; renderCurrent(); }
  else if(a==="closeWeekReview"){ showWeekReview=false; renderCurrent(); }
  else if(a==="weekBoolField"){
    const weeks=loadWeeks(); const weekKey=weekStartKey(new Date());
    weeks[weekKey]=weeks[weekKey]||{};
    weeks[weekKey][el.dataset.kid]=weeks[weekKey][el.dataset.kid]||{skill:"",responsibility:"",explainedMistake:null};
    weeks[weekKey][el.dataset.kid].explainedMistake = el.dataset.val==="true";
    saveWeeks(weeks); renderCurrent();
  }
  else if(a==="kidGoalAdd"){
    const row=el.closest("[data-kid-row]"); if(!row) return;
    const inp=row.querySelector("input");
    const text=(inp.value||"").trim(); if(!text) return;
    const items=loadItems();
    items.push({id:genId(), x:text, o:el.dataset.kid, d:false, dt:null});
    saveItems(items); renderCurrent();
  }
  else if(a==="meTaskAdd"){
    const row=el.closest("[data-me-row]"); if(!row) return;
    const inp=row.querySelector("input");
    const text=(inp.value||"").trim(); if(!text) return;
    const items=loadItems();
    items.push({id:genId(), x:text, o:"me", d:false, dt:null});
    saveItems(items); renderCurrent();
  }
  else if(a==="kgDone"){
    const items=loadItems(); const it=items.find(x=>String(x.id)===String(el.dataset.id));
    if(it){ it.d=true; it.dt=new Date().toISOString(); saveItems(items); renderCurrent(); }
  }
  else if(a==="kgDel"){
    if(!requestDeleteConfirm(el.dataset.id)) return;
    deleteConfirmId=null; clearTimeout(deleteConfirmTimer);
    const items=loadItems().filter(x=>String(x.id)!==String(el.dataset.id));
    saveItems(items); renderCurrent();
  }
  else if(a==="goalDay"){
    const g=state.goals.find(x=>x.id===el.dataset.id); const di=+el.dataset.day;
    if(g.days.includes(di)) g.days=g.days.filter(d=>d!==di); else g.days.push(di);
    save(); renderCurrent();
  }
  else if(a==="goalToggle"){
    const g=state.goals.find(x=>x.id===el.dataset.id); if(!g) return;
    g.active=!g.active; save(); renderCurrent();
  }
  else if(a==="addCustom"){
    const nEl=document.getElementById("customName"), cEl=document.getElementById("customCat");
    const name=(nEl.value||"").trim(); if(!name) return;
    state.goals.push({id:genId(), name, category:cEl.value, days:ALL_DAYS.slice(), active:true});
    save(); renderCurrent();
  }
  else if(a==="saveTargets"){
    const vp=+document.getElementById("protTargetInput").value;
    const vc=+document.getElementById("calTargetInput").value;
    if(vp>0) state.proteinTarget=vp;
    if(vc>0) state.calorieTarget=vc;
    save(); renderCurrent();
  }
  else if(a==="exportData"){ exportAllData(); }
  else if(a==="importDataTrigger"){
    const inp=document.getElementById("importFileInput"); if(inp) inp.click();
  }
  else if(a==="icsExportStart"){
    const activeGoals=state.goals.filter(g=>g.active);
    const kinItems=loadKin();
    if(!activeGoals.length && !kinItems.length){ alert("لا توجد أهداف أو بنود صلة رحم لتصديرها."); return; }
    icsTimeDraft={};
    activeGoals.forEach(g=>{ icsTimeDraft["goal:"+g.id]=CAT_DEFAULT_TIME[g.category]||"08:00"; });
    kinItems.forEach(it=>{ icsTimeDraft["kin:"+it.id]=CAT_DEFAULT_TIME["صِلة الرحم"]||"20:00"; });
    renderCurrent();
  }
  else if(a==="icsExportCancel"){ icsTimeDraft=null; renderCurrent(); }
  else if(a==="icsExportConfirm"){
    const activeGoals=state.goals.filter(g=>g.active);
    const kinItems=loadKin();
    const entries=[];
    activeGoals.forEach(g=>{
      const t=icsTimeDraft["goal:"+g.id];
      if(t) entries.push({name:g.name, days:g.days.slice(), time:t});
    });
    kinItems.forEach(it=>{
      const t=icsTimeDraft["kin:"+it.id]; if(!t) return;
      if(it.cycle==="monthly") entries.push({name:it.title, cycle:"monthly", time:t});
      else entries.push({name:it.title, days:[it.day], time:t});
    });
    if(!entries.length){ alert("لم تختاري وقتاً لأي بند."); return; }
    downloadICS(buildICS(entries));
    icsTimeDraft=null;
    renderCurrent();
  }
});

/* ضغط Enter داخل حقول تحمل data-enter يُفعّل الزرّ المقابل */
view.addEventListener("keydown", e=>{
  if(e.key!=="Enter") return;
  const el=e.target.closest("[data-enter]"); if(!el) return;
  const btn=view.querySelector(`[data-action="${el.dataset.enter}"]`);
  if(btn){ e.preventDefault(); btn.click(); }
});

/* حقول النص/الأرقام: حفظ فوري دون إعادة رسم (للحفاظ على التركيز) */
view.addEventListener("input", e=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  const a=el.dataset.action; const key=todayKey();
  if(a==="inputSpeech"){ getDay(key).speech=el.value; save(); }
  else if(a==="inputNote"){ getDay(key).note=el.value; save(); }
  else if(a==="goalDetail"){ getDay(key).detail[el.dataset.id]=el.value; save(); }
  else if(a==="exWhat"){ getDay(key).exercise.what=el.value; save(); }
  else if(a==="exMinutes"){ getDay(key).exercise.minutes=+el.value||0; save(); }
  else if(a==="exSteps"){ getDay(key).exercise.steps=+el.value||0; save(); }
  else if(a==="kidWhat"){ getDay(key).kids[el.dataset.kid].what=el.value; save(); }
  else if(a==="kidNext"){ getDay(key).kids[el.dataset.kid].next=el.value; save(); }
  else if(a==="kidNote"){ getDay(key).kids[el.dataset.kid].note=el.value; save(); }
  else if(a==="homeThreatWhat"){ getDay(key).home.threatWhat=el.value; save(); }
  else if(a==="homeWhyNot"){ getDay(key).home.whyNot=el.value; save(); }
  else if(a==="authorityField"){ getDay(key).home.authority[el.dataset.field]=el.value; save(); }
  else if(a==="weekField"){
    const weeks=loadWeeks(); const weekKey=weekStartKey(new Date());
    weeks[weekKey]=weeks[weekKey]||{};
    weeks[weekKey][el.dataset.kid]=weeks[weekKey][el.dataset.kid]||{skill:"",responsibility:"",explainedMistake:null};
    weeks[weekKey][el.dataset.kid][el.dataset.field]=el.value;
    saveWeeks(weeks);
  }
  else if(a==="foodSearch"){
    foodSearch=el.value;
    const wrap=document.getElementById("foodListWrap");
    if(wrap) wrap.innerHTML=buildFoodListHtml();
  }
  else if(a==="recipeField"){
    if(!recipeDraft) return;
    recipeDraft[el.dataset.field]=el.value;
    if(el.dataset.field==="servings") refreshRecipeTotals();
  }
  else if(a==="recipeIngField"){
    if(!recipeDraft) return;
    const idx=+el.dataset.idx;
    const row=recipeDraft.ingredients[idx]; if(!row) return;
    row[el.dataset.field]=el.value;
    if(el.dataset.field==="name"){
      const warnSlot=document.getElementById("ingWarn"+idx);
      if(warnSlot){
        const nm=(row.name||"").trim();
        const notFound = nm && !findIngredient(nm);
        warnSlot.innerHTML = notFound
          ? `<button class="ing-warn" data-action="ingAddNew" data-idx="${idx}" title="غير موجود في القاعدة — أضيفي بياناته">⚠️</button>`
          : "";
      }
    }
    refreshRecipeTotals();
  }
  else if(a==="ingAddField"){
    if(!addIngDraft) return;
    addIngDraft[el.dataset.field]=el.value;
  }
  else if(a==="prayerField"){
    state.prayer[el.dataset.field]=+el.value||0; save();
  }
  else if(a==="prayerAdjust"){
    state.prayer.adjustments[el.dataset.key]=+el.value||0; save();
  }
  else if(a==="prayerManualTime"){
    state.prayer.manualTimes[el.dataset.key]=el.value; save();
  }
  else if(a==="icsTimeField"){
    if(!icsTimeDraft) return;
    icsTimeDraft[el.dataset.id]=el.value;
  }
  else if(a==="kinDraftField"){
    if(!kinDraft) return;
    kinDraft[el.dataset.field]=el.value;
  }
  else if(a==="ladderDraftField"){
    if(!ladderDraft) return;
    ladderDraft[el.dataset.field]=el.value;
  }
  else if(a==="stoppedDoing"){ getDay(key).home.stoppedDoing=el.value; save(); }
  else if(a==="tomorrowField"){
    const store=loadTomorrow();
    const items=ensureTomorrowSlot(store, tomorrowKey());
    items[+el.dataset.idx].t=el.value;
    saveTomorrow(store);
  }
  else if(a==="weeklyPrayerBefore"){
    weeklySettings().prayerBefore=+el.value||0; save();
  }
  else if(a==="weeklyPrayerText"){
    weeklySettings().prayerText=el.value||PRAYER_TEXT_DEFAULT; save();
  }
});

/* اختيار صورة الوصفة أو صورة تتبّع البشرة: تصغير عبر canvas قبل الحفظ */
view.addEventListener("change", e=>{
  const skinImgEl=e.target.closest("[data-action='skinPhotoUpload']");
  if(skinImgEl){
    const file=skinImgEl.files&&skinImgEl.files[0]; if(!file) return;
    resizeImageFile(file, 400, 0.6).then(dataUrl=>{
      const photos=loadSkinPhotos();
      photos.push({id:genId(), dataUrl, date:todayKey()});
      saveSkinPhotos(photos);
      skinImgEl.value="";
      renderCurrent();
    }).catch(err=>{
      console.warn(err);
      alert("تعذّر معالجة هذه الصورة. جرّبي صورة أخرى.");
    });
    return;
  }
  const imgEl=e.target.closest("[data-action='recipeImage']");
  if(imgEl){
    const file=imgEl.files&&imgEl.files[0]; if(!file||!recipeDraft) return;
    resizeImageFile(file, 400, 0.6).then(dataUrl=>{
      if(recipeDraft){ recipeDraft.image=dataUrl; renderCurrent(); }
    }).catch(err=>{
      console.warn(err);
      alert("تعذّر معالجة هذه الصورة. جرّبي صورة أخرى.");
    });
    return;
  }
  const likedEl=e.target.closest("[data-action='recipeLiked']");
  if(likedEl){ if(recipeDraft) recipeDraft.liked=likedEl.checked; return; }
  const filterEl=e.target.closest("[data-action='recipeFilterLiked']");
  if(filterEl){ recipeFilterLiked=filterEl.checked; renderCurrent(); return; }
  const sortEl=e.target.closest("[data-action='recipeSort']");
  if(sortEl){ recipeSort=sortEl.value; renderCurrent(); return; }
  const importEl=e.target.closest("[data-action='importFile']");
  if(importEl){
    const file=importEl.files&&importEl.files[0];
    if(file) importAllData(file);
    importEl.value="";
    return;
  }
  const methodEl=e.target.closest("[data-action='prayerMethod']");
  if(methodEl){ state.prayer.method=methodEl.value; save(); renderCurrent(); return; }
  const manualEl=e.target.closest("[data-action='prayerManualToggle']");
  if(manualEl){ state.prayer.manual=manualEl.checked; save(); renderCurrent(); }
  const kinCycleEl=e.target.closest("[data-action='kinDraftCycle']");
  if(kinCycleEl){ if(kinDraft){ kinDraft.cycle=kinCycleEl.value; renderCurrent(); } }
  const homeTimeEl=e.target.closest("[data-action='homeTimeField']");
  if(homeTimeEl){ getDay(todayKey()).home[homeTimeEl.dataset.field]=homeTimeEl.value; save(); }
  const weeklyTimeEl=e.target.closest("[data-action='weeklyTimeField']");
  if(weeklyTimeEl){
    const times=loadTimes();
    if(weeklyTimeEl.value) times[weeklyTimeEl.dataset.id]=weeklyTimeEl.value;
    else delete times[weeklyTimeEl.dataset.id];
    saveTimes(times);
  }
});

/* تلميح رؤوس أعمدة جدول المسؤوليات بالضغط المطوّل (نصف ثانية) */
function respTipStart(el){
  clearTimeout(respTipTimer);
  respTipTimer=setTimeout(()=>{
    respTipActive=el.dataset.tip;
    renderCurrent();
    clearTimeout(respTipTimer);
    respTipTimer=setTimeout(()=>{ respTipActive=null; renderCurrent(); }, 2000);
  }, 500);
}
function respTipCancel(){ clearTimeout(respTipTimer); }

view.addEventListener("touchstart", e=>{
  const el=e.target.closest("[data-tip]"); if(el) respTipStart(el);
}, {passive:true});
view.addEventListener("touchend", respTipCancel);
view.addEventListener("mousedown", e=>{
  const el=e.target.closest("[data-tip]"); if(el) respTipStart(el);
});
view.addEventListener("mouseup", respTipCancel);

function setStatus(id,msg,cls){
  const el=document.getElementById(id); if(!el) return;
  el.textContent=msg; el.className="status "+(cls||"");
}

/* ---- تصدير واستيراد كل بيانات التطبيق ---- */
const APP_STORAGE_KEYS = [STORAGE_KEY, MY_FOODS_KEY, ITEMS_KEY, RECIPES_KEY, MY_INGS_KEY, KIN_KEY, TIMES_KEY, LADDER_KEY, TOMORROW_KEY, CATCH_KEY, SKIN_KEY, SKIN_PHOTOS_KEY];
function exportAllData(){
  const data={};
  APP_STORAGE_KEYS.forEach(k=>{
    const raw=localStorage.getItem(k);
    if(raw!=null){ try{ data[k]=JSON.parse(raw); }catch(e){ data[k]=null; } }
  });
  const payload={ app:"متابعتي", version:VERSION, exportedAt:new Date().toISOString(), data };
  const blob=new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`mutabaati-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importAllData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let payload;
    try{ payload=JSON.parse(reader.result); }
    catch(e){ alert("تعذّر قراءة ملف الاستيراد. تأكّدي أنه ملف تصدير صحيح من «متابعتي»."); return; }
    const data=payload&&payload.data ? payload.data : payload;
    if(!data || typeof data!=="object"){
      alert("تعذّر قراءة ملف الاستيراد. تأكّدي أنه ملف تصدير صحيح من «متابعتي».");
      return;
    }
    if(!confirm("سيُستبدَل كل المحتوى الحالي (الأهداف، الوجبات، الوصفات، أهداف الأولاد...) ببيانات هذا الملف. هل تريدين المتابعة؟")) return;
    APP_STORAGE_KEYS.forEach(k=>{
      if(data[k]!==undefined) localStorage.setItem(k, JSON.stringify(data[k]));
    });
    alert("تمّ استيراد بياناتك بنجاح. سيُعاد تحميل التطبيق الآن.");
    location.reload();
  };
  reader.onerror=()=>alert("تعذّر قراءة الملف.");
  reader.readAsText(file);
}

/* التنقّل بين التبويبات */
document.getElementById("tabs").addEventListener("click", e=>{
  const b=e.target.closest("button[data-tab]"); if(!b) return;
  currentTab=b.dataset.tab; renderCurrent();
});

/* الالتقاط السريع — زرّ عائم وشاشته الخاصة، خارج #view فيبقى ثابتاً في كل التبويبات */
document.getElementById("fabCatch").addEventListener("click", ()=>{
  catchDraft={text:"", kid:null, when:"dinner"};
  catchSheetOpen=true;
  renderCatchSheet();
  setTimeout(()=>{ const el=document.getElementById("catchTextInput"); if(el) el.focus(); }, 0);
});
document.getElementById("catchSheetSlot").addEventListener("click", e=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  const a=el.dataset.action;
  if(a==="catchCancel"){ catchSheetOpen=false; catchDraft=null; renderCatchSheet(); }
  else if(a==="catchKidField"){ catchDraft.kid=el.dataset.val; renderCatchSheet(); }
  else if(a==="catchWhenField"){ catchDraft.when=el.dataset.val; renderCatchSheet(); }
  else if(a==="catchSave"){
    const text=(catchDraft.text||"").trim();
    if(!text){ alert("اكتبي الملاحظة أولاً."); return; }
    if(!catchDraft.kid){ alert("اختاري الطفل أولاً."); return; }
    const list=loadCatch();
    list.push({id:genId(), text, kid:catchDraft.kid, when:catchDraft.when, created:Date.now(), done:false, moved:0, archived:false});
    saveCatch(list);
    catchSheetOpen=false; catchDraft=null;
    renderCatchSheet();
    renderCurrent(); // لتحديث بطاقة «للمتابعة معهم» فوراً إن حان وقتها الآن
  }
  // catchSheetNoop: لا فعل — يمنع الفقاعة من الوصول لـ catchCancel عند الضغط داخل الشاشة
});
document.getElementById("catchSheetSlot").addEventListener("input", e=>{
  const el=e.target.closest("[data-action='catchTextField']"); if(!el || !catchDraft) return;
  catchDraft.text=el.value; // بلا رندر أثناء الكتابة حتى لا يفقد الحقل تركيزه
});

/* البدء — بعد السابعة مساءً تُفتح «ليلتي»، وقبلها «اليوم» كالمعتاد */
if(new Date().getHours()>=19) currentTab="night";
renderHeader();
renderCurrent();

/* تسجيل service worker — نمرّر رقم النسخة في الرابط ليعرف المتصفح أن هناك تحديثاً */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js?v="+VERSION).catch(err=>console.warn("SW:",err));
  });
}
</script>
