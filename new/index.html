function baseTimes(s,settings=DB.settings){const dt=dateObj(s),lat=Number(settings.lat),lng=Number(settings.lng),jd=Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/86400000+2440587.5-lng/360,tz=-dt.getTimezoneOffset()/60;const angles={MWL:[18,17],ISNA:[15,15],Egypt:[19.5,17.5],Karachi:[18,18]}[settings.method]||[18,17];
 const noon=t=>12-solar(jd+t/24).eq;
 const angle=(a,t,side)=>{const D=solar(jd+t/24).dec,c=(-sin(a)-sin(lat)*sin(D))/(cos(lat)*cos(D));if(c>1||c< -1)return NaN;return noon(t)+(side==='before'?-1:1)*deg(Math.acos(c))/15};
 let v={fajr:5,rise:6,dhuhr:12,asr:13,maghrib:18,isha:18};for(let i=0;i<3;i++){const D=solar(jd+v.asr/24).dec,asrAngle=-deg(Math.atan(1/(1+tan(Math.abs(lat-D)))));v={fajr:angle(angles[0],v.fajr,'before'),rise:angle(.833,v.rise,'before'),dhuhr:noon(v.dhuhr),asr:angle(asrAngle,v.asr,'after'),maghrib:angle(.833,v.maghrib,'after'),isha:angle(angles[1],v.isha,'after')}}
 for(const k of Object.keys(v))v[k]+=tz-lng/15;
 const night=hour(v.rise-v.maghrib),fajrLimit=angles[0]/60*night,ishaLimit=angles[1]/60*night;
 if(!Number.isFinite(v.fajr)||hour(v.rise-v.fajr)>fajrLimit)v.fajr=v.rise-fajrLimit;
 if(!Number.isFinite(v.isha)||hour(v.isha-v.maghrib)>ishaLimit)v.isha=v.maghrib+ishaLimit;
 return v}
function prayerTimes(s=currentDate){const manual=DB.settings.prayerMode==='manual';const v=baseTimes(s);const out={};for(const k of Object.keys(PRAYERS)){if(manual){out[k]=DB.settings.manual[k]||'';continue}const minutes=Math.round(hour(v[k]+Number(DB.settings.adjust[k]||0)/60)*60)%1440;out[k]=Number.isFinite(minutes)?`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`:''}return out}
function prayerDateTime(s,k){if(DB.settings.prayerMode==='manual'){const t=DB.settings.manual[k];return t?new Date(s+'T'+t+':00'):null}const raw=baseTimes(s)[k]+Number(DB.settings.adjust[k]||0)/60;if(!Number.isFinite(raw))return null;const d=new Date(s+'T00:00:00');d.setMinutes(Math.round(raw*60));return d}
function nextPrayer(){const now=new Date(),choices=[];for(const s of [shift(today,-1),today,shift(today,1)])for(const [k,name] of Object.entries(PRAYERS)){const at=prayerDateTime(s,k);if(at&&at>now)choices.push({at,k,name,s})}choices.sort((a,b)=>a.at-b.at);if(!choices.length)return 'راجعي الأوقات اليدوية';const x=choices[0],mins=Math.ceil((x.at-now)/60000),clock=x.at.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});return `${x.name}${dateKey(x.at)!==today?' غدًا':''} ${clock} — بعد ${mins>=60?num(Math.floor(mins/60))+' ساعة و ':''}${num(mins%60)} دقيقة`}

function kinDue(item,s=currentDate){if(item.cycle==='monthly')return !item.last||dateObj(s)-dateObj(item.last)>=30*86400000;return dateObj(s).getDay()===Number(item.day)&&(!item.last||weekStart(item.last)!==weekStart(s))}
function captureDue(c){if(c.done||c.archived)return false;const h=new Date().getHours()+new Date().getMinutes()/60;const starts={afterschool:[13,17],dinner:[16,19.5],night:[19.5,24],morning:[6,9.5]};const [a,z]=starts[c.when]||starts.dinner;if(c.when==='morning'&&dateKey(new Date(c.created))===today)return false;return h>=a&&h<z}
function tomorrowRows(s=currentDate){const list=DB.tomorrow[s]||[];return list.map((x,i)=>!x.t?.trim()?'':`<div class="task-row ${x.done?'done':''}">${b('tomorrow-done',x.done?'✓':'○',`data-index="${i}" aria-label="إنجاز ${esc(x.t)}"`)}<span class="grow">${esc(x.t)}${x.moved>=3?'<small class="amber"> انتقلت '+num(x.moved)+' مرات — هل هي مهمّة فعلًا؟</small>':''}</span>${!x.done?b('tomorrow-move','↻',`data-index="${i}" aria-label="انقليها لغد"`):''}${b('tomorrow-delete','✕',`data-index="${i}" aria-label="اشطبي"`,'delete')}</div>`).join('')}
function renderToday(){const due=dueGoals(),done=due.filter(g=>success(g)).length;const special=due.filter(g=>g.days.length===1&&!success(g));const tomorrow=(DB.tomorrow[currentDate]||[]).filter(x=>x.t?.trim());const c=DB.catch.filter(captureDue);const prayerAll=Object.entries(prayerTimes()).map(([k,v])=>`<div class="row between"><span>${PRAYERS[k]}</span><b dir="ltr">${v||'—'}</b></div>`).join('');return `${pageIntro('اليوم','صلواتكِ ومهامّكِ وما تحتاجين الوصول إليه بسرعة')}${quickActions()}<section class="card prayer-card"><p class="eyebrow">الصلاة القادمة</p><details><summary class="sky">${nextPrayer()}</summary>${prayerAll}<p class="muted small">حساب محلي تقديري مع معالجة شفق الصيف؛ يمكنك مطابقته مع جدول مسجدك في «بياناتي».</p></details><div class="row between"><span class="dua-fixed grow" data-a="dua-explain" role="button" tabindex="0">اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبَادَتِكَ</span>${b('duas','أدعيتي','aria-label="أدعيتي"','quiet-btn')}</div></section>${tomorrow.length?`<section class="card"><h2>كتبتِ لنفسكِ أمس</h2>${tomorrowRows()}</section>`:''}${c.length?`<section class="card"><h2>للمتابعة معهم</h2>${c.map(item=>`<div class="goal"><b>${esc(item.kid)}</b><p>${esc(item.text)}</p><div class="chips">${b('catch-done','✓ تابعتُها',`data-id="${item.id}"`,'chip')}${b('catch-defer','↻ أجّليها',`data-id="${item.id}"`,'chip')}${b('catch-archive','✕ اشطبيها',`data-id="${item.id}"`,'chip')}</div></div>`).join('')}</section>`:''}${dateObj(currentDate).getDay()===0?b('settings-page','اليوم الأحد — رتّبي أسبوعكِ (٥ دقائق)','data-page="weekly"','wide sky-note'):''}${special.length?`<div class="notice">اليوم ${dateObj(currentDate).toLocaleDateString('ar',{weekday:'long'})} — ${special.map(g=>esc(g.t)).join(' و ')}</div>`:''}<h2 class="section-label">أدواري اليوم</h2><section class="domains">${DOMAINS.map(([id,name,color,desc])=>{const gs=due.filter(g=>g.g===id),n=gs.filter(g=>success(g)).length;const kin=DB.kin.filter(k=>kinDue(k));return `<div class="card">${b('domain',`${id==='kin'?'<span style="font-size:2rem">📞</span>':`<svg class="ring" viewBox="0 0 56 56" aria-label="${num(n)} من ${num(gs.length)}"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="28" cy="28" r="24" fill="none" stroke="var(--${color})" stroke-width="4" stroke-dasharray="${gs.length?n/gs.length*151:0} 151" transform="rotate(-90 28 28)"/><text x="28" y="33" text-anchor="middle">${num(n)}/${num(gs.length)}</text></svg>`}<span><strong class="${color}">${name}</strong><small>${id==='kin'?kin.length?num(kin.length)+' موعد مستحق':'لا موعد اليوم':desc}</small></span>`,`data-domain="${id}"`,'domain')}</div>${domain===id?`<div class="card domain-tasks">${id==='kin'?renderKin(false):goalRows(gs.filter(g=>!g.prayer))+(id==='self'?`<details><summary>صلواتي</summary>${prayerRow()}</details>`:'')}</div>`:''}`}).join('')}</section><p class="muted" style="text-align:center;margin:16px">${due.length&&done===due.length?'أنهيتِ يومكِ 🌿':`أنجزتِ ${num(done)} من ${num(due.length)} اليوم`}</p><details class="card"><summary>مهامّ تنتظرني (${num(DB.items.filter(x=>x.o==='me'&&!x.d).length)})</summary>${taskList('me',false)}</details><details class="card"><summary>دفتر اليوم</summary>${area('speech','كلمة أريد تذكّرها')}${area('note','ملاحظة عن اليوم')}</details>`}

function renderKin(edit=false){return DB.kin.map(k=>`<div class="goal"><div class="row between"><span class="grow"><b>${esc(k.title)}</b><small class="muted" style="display:block">${k.cycle==='monthly'?'كل ٣٠ يومًا':`كل ${['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'][k.day]}`} · آخر مرة ${k.last?esc(k.last):'لم تُسجَّل'}</small></span>${b('kin-done',kinDue(k)?'تمّ':'✓',`data-id="${k.id}"`,k.last===currentDate?'yes':'')}</div>${k.id==='kids-msg'?chips(KIDS.slice(0,4),(k.kids[currentDate]||[]),'kin-kid',`data-id="${k.id}"`)+`<span class="small muted">${num((k.kids[currentDate]||[]).length)} من ٤ أرسلوا</span>`:''}${edit?`<div class="row"><label class="grow">التكرار<select data-kin-cycle="${k.id}"><option value="weekly" ${k.cycle==='weekly'?'selected':''}>أسبوعي</option><option value="monthly" ${k.cycle==='monthly'?'selected':''}>كل ٣٠ يومًا</option></select></label>${k.cycle==='weekly'?`<label class="grow">اليوم<select data-kin-day="${k.id}">${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map((d,i)=>`<option value="${i}" ${Number(k.day)===i?'selected':''}>${d}</option>`).join('')}</select></label>`:''}${b('delete','✕',`data-key="kin" data-id="${k.id}" aria-label="حذف"`,'delete')}</div>`:''}</div>`).join('')+(edit?`<label>صلة جديدة<input id="kinTitle"></label>${b('kin-add','أضيفي موعدًا','','primary')}`:'')}

function renderSkin(){const d=day(),retinal=DB.skin.retinalDays.includes(dateObj(currentDate).getDay()),paused=DB.skin.paused,pm=[['wash','غسول'],...(paused?[]:retinal?[['dry','انتظرتُ حتى جفّ الوجه'],['retinal','CELIMAX The Vita-A Retinal Shot 0.1%']]:[['bright','CELIMAX Pore + Dark Spot Brightening Serum']]),['moist','Toleriane Fluide'],['noni','CELIMAX Real Noni Energy Ampoule عند الحاجة']];const routine=(rows,part)=>rows.map(([id,t])=>b('skin-step',esc(t),`data-part="${part}" data-id="${id}"`,'wide '+(d.skin[part].includes(id)?'yes':'')+(id==='spf'?' amber':''))).join('');const week=weekStart(currentDate),patch=Object.keys(DB.days).filter(s=>weekStart(s)===week&&DB.days[s].skin?.patch).length;const clearWeeks=[0,1,2].every(i=>DB.skin.weeks[weekStart(shift(currentDate,-i*7))]===false);return `<section class="card"><h2>الصباح</h2>${DB.skin.vitCPaused?'<p class="notice">C-Glow موقوف لأنكِ ذكرتِ الحرقة والحكّة. لا تسجّلي استخدامه مع استمرار التهيّج.</p>':''}${routine(SKIN_AM.filter(([id])=>id!=='vitc'||!DB.skin.vitCPaused),'am')}</section><section class="card"><h2>${paused?'ليلة ترطيب':retinal?'ليلة ريتينال':'ليلة تفتيح'}</h2>${retinal&&!paused?'<p class="plum small">بلا أحماض مقشّرة الليلة · بلا ريتينول · لا يُقرَّب من خط الرموش.</p>':''}${routine(pm,'pm')}<p class="notice plum">الحمل أو التخطيط له: يُوقَف الريتينال والريتينول.</p></section><section class="card"><h2>جسمي</h2>${b('skin-bool','Eucerin DermoPure Clinical للظهر','data-key="body"','wide '+(d.skin.body?'yes':''))}<p class="muted">طبقة رقيقة بعد الاستحمام · بلا فرك · بلا أحماض إضافية.</p>${b('skin-bool','لصقة العين · '+num(patch)+' / ٣ هذا الأسبوع','data-key="patch"','wide '+(d.skin.patch?'yes':''))}<p class="muted">اختيارية للترطيب والانتفاخ فقط، ليست علاج الهالات.</p></section><section class="card"><h2>تدرّجي</h2><p>هل حدث تهيّج أو احمرار أو حرقة أو تقشّر هذا الأسبوع؟</p><div class="chips">${b('skin-week','نعم','data-value="true"','chip '+(DB.skin.weeks[week]===true?'selected':''))}${b('skin-week','لا', function barChart(values,color='moss',max=null){const m=max||Math.max(1,...values.map(x=>x[1]||0));return `<svg class="chart" viewBox="0 0 320 108" role="img" aria-label="تطور القيم خلال آخر ١٤ يومًا"><line x1="16" y1="83" x2="304" y2="83" stroke="var(--line)"/>${values.map(([s,v],i)=>{const x=16+i*288/14,w=288/14*.6,h=Math.max(0,Number(v||0))/m*60;return `${v===null||v===undefined?`<line x1="${x}" x2="${x+w}" y1="82" y2="82" stroke="var(--line)"/>`:`<rect x="${x}" y="${83-h}" width="${w}" height="${h||1}" rx="2" fill="var(--${color})"><title>${esc(s)}: ${num(v)}</title></rect>`}<text x="${x+w/2}" y="99" text-anchor="middle">${num(Number(s.slice(-2)))}</text>`}).join('')}</svg>`}

function renderProgress(){const n=recorded().length;if(n<14)return `<section class="card"><h2>يتّضح الأثر مع الوقت</h2><p>بقيت ${num(14-n)} ليالٍ مسجّلة قبل ظهور التطوّر.</p><p class="muted">لا حاجة إلى ملء كل شيء. أغلقي تسجيل الليلة حين ينتهي يومكِ.</p><div class="progress-line"><i style="width:${n/14*100}%"></i></div></section>`;const dates=progressDays(),rows=dates.filter(s=>DB.days[s]),avg=rows.length?rows.reduce((a,s)=>a+activePct(s),0)/rows.length:0;let streak=0;for(let s=today;DB.days[s]?.nightSaved;s=shift(s,-1))streak++;const taskDone=DB.items.filter(t=>t.d),quiet=rows.filter(s=>!KIDS.some(k=>DB.days[s].kids[k]?.scold)).length;const prayerStats=Object.entries(PRAYERS).map(([k,t])=>{const v=rows.map(s=>DB.days[s].prayers[k]);return {t,on:v.filter(x=>x==='ontime').length,late:v.filter(x=>x==='late').length,miss:v.filter(x=>x==='missed').length,blank:v.filter(x=>!x).length}}).sort((a,b)=>(b.late+b.miss)-(a.late+a.miss));const missed=DB.active.map(g=>({g,count:rows.filter(s=>dueGoals(s).includes(g)&&DB.days[s].done[g.t]==='no').length})).filter(x=>x.count>=3);const scolds=rows.flatMap(s=>KIDS.filter(k=>DB.days[s].kids[k]?.scold).map(k=>({s,k,...DB.days[s].kids[k]})));const group=key=>{const counts={};for(const x of scolds)for(const t of x[key]||[])counts[t]=(counts[t]||0)+1;return Object.entries(counts).sort((a,b)=>b[1]-a[1])};const scoldStats=['at','trigger','reaction','state'].map(key=>{const g=group(key);return g.length?`<p>${({at:'الوقت',trigger:'المحفّز',reaction:'ردّي',state:'حالتي'})[key]}: ${g.map(([t,n])=>esc(t)+' ('+num(n)+')').join('، ')}</p>`:''}).join('');const fatigue=scolds.filter(x=>(x.state||[]).some(t=>['متعبة','قليلة النوم'].includes(t))).length;const respStats=DB.resp.children.map(k=>{const cells=rows.flatMap(s=>Object.keys(RESP).map(key=>DB.days[s].kids[k]?.resp?.[key]));const filled=cells.filter(Boolean),alone=filled.filter(v=>v==='alone').length;const weakest=Object.keys(RESP).map(key=>[key,rows.filter(s=>DB.days[s].kids[k]?.resp?.[key]==='reminded').length]).sort((a,b)=>b[1]-a[1])[0];return `<p><b>${k}</b>: ${num(alone)} وحده من ${num(filled.length)} مسجّلة ${filled.length?'('+num(alone/filled.length*100)+'٪)':''}${weakest[1]?` · التدريب التالي: ${RESP[weakest[0]][1]}`:''}</p>`}).join('');const hugStats=KIDS.map(k=>{const keys=Object.keys(HUGS).filter(key=>DB.resp.school[k]||!['door','back'].includes(key));const yes=rows.reduce((a,s)=>a+keys.filter(key=>DB.days[s].kids[k]?.hugs?.[key]).length,0);return [k,rows.length?yes/(rows.length*keys.length)*100:0]});const sortedHugs=[...hugStats].sort((a,b)=>a[1]-b[1]);const last30=progressDays(30).filter(s=>DB.days[s]);return `<section class="card"><h2>حديقتي</h2><div class="garden">${progressDays(30).map(s=>{const p=activePct(s),bg=!DB.days[s]?'#e5e2dc':p>=.8?'#4C6B52':p>=.5?'#8eab90':p>0?'#c8d8c6':'#ebe4d5';return `<span style="background:${bg};color:${p>=.8?'white':'var(--ink)'}" title="${s}: ${num(p*100)}٪">${num(Number(s.slice(-2)))}</span>`}).join('')}</div><div class="two" style="margin-top:15px"><p>تتابع التسجيل: ${num(streak)}</p><p>متوسط أهداف ١٤ يومًا: ${num(avg*100)}٪</p><p>مهام أُنجزت: ${num(taskDone.length)}</p><p>أيام بلا توبيخ مسجّل: ${num(quiet)}</p></div><p class="muted small">الخانات غير المسجّلة لا تعني عدم حدوث الشيء. النسب تصف ما دوّنتِه فقط.</p></section><section class="card"><h2>يومي وجسدي</h2>${progressChart('أهداف اليوم',(_,s)=>activePct(s)*100,'moss',100)}${progressChart('البروتين غ',d=>totals(d.meals).p)}${progressChart('السعرات',d=>totals(d.meals).c,'amber')}${progressChart('الماء بالأكواب',d=>d.water,'sky',8)}${progressChart('خطواتي',d=>d.steps===''?null:Number(d.steps),'sky')}${progressChart('التوبيخ',d=>KIDS.filter(k=>d.kids[k]?.scold).length,'plum',5)}</section><details class="card"><summary>صلواتي — الأضعف أولًا</summary>${prayerStats.map(x=>`<p>${x.t}: في وقتها ${num(x.on)} · متأخرة ${num(x.late)} · فاتت ${num(x.miss)} · غير مسجّلة ${num(x.blank)}</p>`).join('')}</details><details class="card"><summary>ما صَعُب عليّ</summar function icsEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function utcStamp(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
function foldICS(line){let out='',part='',bytes=0;for(const c of line){const n=new TextEncoder().encode(c).length;if(bytes+n>73){out+=part+'\r\n ';part='';bytes=1}part+=c;bytes+=n}return out+part}
function buildCalendar(start=currentDate){const events=[],monthly=new Set(),stamp=utcStamp(new Date());function event(s,time,title,kind,id,actual=null){if(!/^\d{2}:\d{2}$/.test(time))return;const at=actual||new Date(s+'T'+time+':00');if(!Number.isFinite(at.getTime()))return;events.push(['BEGIN:VEVENT','UID:'+hash(kind+'|'+id+'|'+s)+'@mutabaati.local','DTSTAMP:'+stamp,'DTSTART:'+utcStamp(at),'DTEND:'+utcStamp(new Date(at.getTime()+15*60000)),'SUMMARY:'+icsEscape(title),'CATEGORIES:'+kind,'BEGIN:VALARM','TRIGGER:-PT5M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(title),'END:VALARM','END:VEVENT'].join('\n'))}for(let i=0;i<7;i++){const s=shift(start,i),times=prayerTimes(s);for(const [k,t] of Object.entries(PRAYERS))event(s,times[k],'صلاة '+t,'PRAYER',k,prayerDateTime(s,k));for(const g of dueGoals(s).filter(g=>!g.prayer&&g.when))event(s,g.when,g.t,'GOAL',g.t);for(const k of DB.kin.filter(k=>kinDue(k,s)&&k.when)){if(k.cycle!=='monthly'||!monthly.has(k.id)){event(s,k.when,k.title,'KIN',k.id);monthly.add(k.id)}}}let sunday=start;while(dateObj(sunday).getDay()!==0)sunday=shift(sunday,1);event(sunday,'20:30','مراجعة أسبوعي','REVIEW','weekly');return {text:['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mutabaati//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH',...events,'END:VCALENDAR'].join('\n').split('\n').map(foldICS).join('\r\n')+'\r\n',count:events.length,prayers:events.filter(x=>x.includes('CATEGORIES:PRAYER')).length}}
async function compressImage(file){const bitmap=await createImageBitmap(file),scale=Math.min(1,400/bitmap.width),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/jpeg',.6)}

function safeId(x){return typeof x==='string'&&/^[a-zA-Z0-9_.-]{1,120}$/.test(x)}
function validateBackup(obj){if(!obj||typeof obj!=='object'||Array.isArray(obj)||!Object.keys(obj).length)throw Error('نسخة فارغة أو غير صحيحة');const arrays=['active','items','catch','kin','ladder','skills','meals','myfoods','myings','recipes','duas','tales'];const objects=['days','tomorrow','resp','weeks','skin','times','settings'];for(const [key,v] of Object.entries(obj)){if(!/^mt_[a-zA-Z0-9_]+$/.test(key))throw Error('مفتاح خارج بيانات متابعتي');const k=key.slice(3);if(arrays.includes(k)&&!Array.isArray(v))throw Error('صيغة '+k+' غير صحيحة');if(objects.includes(k)&&(!v||typeof v!=='object'||Array.isArray(v)))throw Error('صيغة '+k+' غير صحيحة');if(['ptarget','ctarget'].includes(k)&&(!Number.isFinite(v)||v<=0))throw Error('الهدف الغذائي غير صحيح')}for(const k of ['items','catch','kin','ladder','meals','recipes','duas','tales'])if(obj['mt_'+k]?.some(x=>!x||!safeId(x.id)))throw Error('معرّف غير صحيح في '+k);if(obj.mt_resp?.children.some(k=>!KIDS.includes(k)))throw Error('اسم طفل غير صحيح');if(obj.mt_skin?.photos.some(p=>!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p.src)))throw Error('صيغة الصورة غير صحيحة');if(obj.mt_recipes?.some(r=>typeof r.n!=='string'||!Array.isArray(r.rows)||(r.photo&&!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(r.photo))))throw Error('صيغة وصفة غير صحيحة');if(obj.mt_kin?.some(k=>typeof k.title!=='string'||!['weekly','monthly'].includes(k.cycle)||(k.id==='kids-msg'&&!k.kids)))throw Error('صيغة موعد غير صحيحة');if(obj.mt_removed&&(!Array.isArray(obj.mt_removed.duas)||!Array.isArray(obj.mt_removed.tales)))throw Error('قائمة المحتوى المحذوف غير صحيحة');if(obj.mt_active?.some(g=>!g||typeof g.t!=='string'||!Array.isArray(g.days)))throw Error('أهداف غير صحيحة');if(obj.mt_days)for(const [s,d] of Object.entries(obj.mt_days))if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||!d||!d.done||!d.prayers||!d.kids||!Array.isArray(d.meals)||!d.home||!d.skin)throw Error('سجل يوم غير مكتمل');if(obj.mt_settings&&(!obj.mt_settings.adjust||!obj.mt_settings.manual))throw Error('إعدادات الصلاة غير مكتملة');if(obj.mt_skin&&(!Array.isArray(obj.mt_skin.photos)||!Array.isArray(obj.mt_skin.retinalDays)||!obj.mt_skin.weeks))throw Error('إعدادات البشرة غير مكتملة');if(obj.mt_resp&&(!Array.isArray(obj.mt_resp.children)||!obj.mt_resp.school))throw Error('إعدادات الأطفال غير مكتملة')}
